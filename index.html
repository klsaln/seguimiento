<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Peptides"><title>Peptide Tracker</title><style>
/* ===== Peptide Tracker · tema laboratorio (claro, clínico, azul eléctrico) ===== */
:root{
  --bg:#f2f5fa;--surface:#fff;--surface2:#f6f9fd;--line:#dde4ef;--line2:#c5d0e0;
  --ink:#0d1b2e;--ink2:#51627a;--ink3:#8091a8;
  --blue:#1f55f2;--blue-d:#1743c4;--blue-l:#eaf0ff;--blue-b:#c7d7ff;
  --red:#c62828;--red-l:#fdeeee;--red-b:#f1c2c2;
  --amber:#7a4a00;--amber-l:#fff6e0;--amber-b:#efc468;
  --shadow:0 1px 2px rgba(15,35,70,.05),0 6px 16px rgba(15,35,70,.05);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);color-scheme:light;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(#d4dcea 1px,transparent 1.2px);background-size:22px 22px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
svg{max-width:100%}
.hidden{display:none}

/* encabezado */
header{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);padding:max(16px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
.head{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:750;letter-spacing:-.3px;color:var(--ink)}
.logo svg{width:24px;height:24px;flex:none;color:var(--blue)}
.small{font-size:12px;color:var(--ink3);margin-top:2px}
.pill{border:1px solid var(--line2);border-radius:999px;padding:7px 13px;background:#fff;color:var(--ink);font-weight:600;font-size:14px}
main{max-width:720px;margin:auto;padding:20px 16px 104px}
h2{margin:4px 0 16px;font-size:24px;font-weight:750;letter-spacing:-.4px;color:var(--ink)}
h4{margin:14px 0 8px;font-size:14px;font-weight:650;color:var(--ink2)}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{display:flex;align-items:center;margin:0 0 13px;font-size:16px;font-weight:650;color:var(--ink)}
.card h3::before{content:'';flex:none;width:3px;height:15px;border-radius:2px;background:var(--blue);margin-right:10px}
.muted{color:var(--ink2);font-size:13px;line-height:1.45}
.big{font-size:32px;font-weight:750;letter-spacing:-.6px;color:var(--ink)}
.mint{color:var(--blue);font-weight:650}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat b{font-size:22px;display:block;font-weight:700;color:var(--ink)}
.item{border-top:1px solid var(--line);padding:12px 0}
.hist{background:var(--surface2);border:1px dashed var(--line2);border-radius:12px;padding:4px 12px;margin-top:6px;font-size:13px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hsub{color:var(--ink3);font-size:12px;margin-top:2px}

/* botones */
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:12px;padding:12px 16px;font-weight:650;letter-spacing:.1px;transition:background .15s,border-color .15s}
.btn:active{background:var(--blue-d);border-color:var(--blue-d)}
.btn.secondary,.secondary{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.secondary:active{background:var(--surface2)}
.btn.outline,.outline{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn.outline:active{background:var(--blue-l)}
.btn.danger,.danger{background:var(--red-l);color:var(--red);border:1px solid var(--red-b)}
.btn.on,#modal form .btn.full{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.tiny{padding:6px 12px;font-size:12px;border-radius:10px;background:#fff;color:var(--blue);border:1px solid var(--line2)}
.hist .btn.tiny{background:#fff}
.full{width:100%}

/* navegación inferior */
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-around;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);padding:9px 4px max(12px,env(safe-area-inset-bottom))}
nav button{position:relative;border:0;background:none;color:var(--ink3);font-size:11px;font-weight:500;display:flex;align-items:center;flex-direction:column;gap:4px;min-width:50px}
nav button.active{color:var(--blue);font-weight:700}
nav button.active::before{content:'';position:absolute;top:-10px;left:22%;right:22%;height:2px;border-radius:0 0 3px 3px;background:var(--blue)}
nav span{display:flex}
nav svg{width:23px;height:23px}

/* formularios */
label{font-size:13px;font-weight:500;color:var(--ink2)}
.field{display:block;width:100%;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:12px;margin:7px 0 12px}
.field::placeholder{color:var(--ink3)}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,85,242,.18)}
select.field{background-color:#fff}
.check{width:21px;height:21px;accent-color:var(--blue)}
input[type=range]{accent-color:var(--blue)}
input[type=date],input[type=datetime-local]{color-scheme:light}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.tabs button{white-space:nowrap}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:12px;margin:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chips .chip{border:1px solid var(--line2);border-radius:999px;padding:9px 13px;color:var(--ink);font:inherit;font-size:14px;background:#fff;margin:0}
.chips .chip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:650}
.bar{height:10px;background:#e3eaf4;border-radius:10px;overflow:hidden}
.bar>div{height:100%;background:var(--blue);border-radius:10px}

/* avisos */
.notice{border-left:3px solid var(--blue);padding:9px 12px;background:var(--surface2);border-radius:8px;font-size:12px;color:var(--ink2);margin:10px 0}
.alert{border:1px solid var(--amber-b);background:var(--amber-l);color:var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.45}
.alert b{color:#5c3600}
.plan{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.45;color:var(--ink)}
.care{border:1px solid var(--blue-b);background:var(--blue-l);border-left:3px solid var(--blue);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.45;color:var(--ink)}
.hint{color:var(--ink2);font-size:13px;margin:0 0 10px;line-height:1.4}

/* ventana emergente */
dialog{position:fixed;inset:0;margin:auto;width:min(92vw,440px);max-height:calc(100dvh - 44px);padding:0 16px 14px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:20px;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 24px 60px rgba(13,27,46,.28)}
@supports not (height:100dvh){dialog{max-height:80vh}}
@media(max-height:700px){dialog{max-height:72dvh}}
dialog:not([open]){display:none}
dialog[open]{display:block}
dialog::backdrop{background:rgba(13,27,46,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#fff;padding:12px 0 8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3)}
.modal-x{border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);border-radius:50%;width:38px;height:38px;font-size:25px;line-height:1}
.modal-footer{position:sticky;bottom:-14px;background:#fff;padding:10px 0 5px}
.modal-cancel{width:100%;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);border-radius:12px;padding:10px;font-weight:600}
#modal h3{font-size:20px;font-weight:700;letter-spacing:-.3px;margin:16px 0 14px;color:var(--ink)}
#modal .field{padding:10px;margin:5px 0 10px}
#modal label{font-size:12px}
#modal textarea{max-height:110px}
#modal .btn{padding:11px}
body:has(dialog[open]){overflow:hidden}
#mw textarea.field{max-height:210px;min-height:92px}
.steps{display:flex;gap:5px;margin:14px 0 6px}
.steps i{flex:1;height:4px;border-radius:4px;background:#dbe3ef}
.steps i.on{background:var(--blue)}
.wnav{margin:14px 0 8px;gap:10px}
.wnav .btn{flex:1}

/* bloqueo con PIN */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
#lock>div{width:100%;max-width:340px}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--surface2);color:var(--ink)}
.cd.t{outline:1.5px solid var(--blue)}
.cd.a::after,.cd.s::after{content:'';width:7px;height:7px;border-radius:50%;margin-top:2px}
.cd.a::after{background:var(--blue)}
.cd.s::after{border:1.5px solid var(--blue)}

/* mapa del cuerpo */
.sitemap{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;margin:8px 0}
.sitemap svg{width:100%;max-width:240px;height:auto;touch-action:manipulation}
.sitemap .bd{fill:#e6ecf6;stroke:#b8c5d9}
.sitemap .hit{fill:rgba(0,0,0,0)}
.sitemap .dot{fill:#fff;stroke:#8fa2bd;stroke-width:1.5}
.sitemap .sug .dot{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:3 2}
.sitemap .on .dot{fill:var(--blue);stroke:var(--blue);stroke-dasharray:none}
.sitemap text{fill:var(--ink2);font-size:10px;text-anchor:middle;pointer-events:none}
.sitemap .on text{fill:#fff;font-weight:700}
.sitemap .st{cursor:pointer}

/* vial */
.vialwrap{display:flex;gap:16px;align-items:center}
.vial{width:112px;flex:none}
.vial text{fill:var(--ink3);font-size:9px}
.vialinfo{flex:1;min-width:0}

/* interruptores */
.swrap{display:inline-flex;align-items:center;gap:8px;flex:none}
.swt{font-size:13px;color:var(--ink3);min-width:20px;text-align:right}
.swt.on{color:var(--blue);font-weight:700}
.sw{position:relative;width:54px;height:32px;border-radius:999px;border:1px solid #c1ccdc;background:#d3dbe8;padding:0;flex:none;touch-action:pan-y;transition:background .18s,border-color .18s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(13,27,46,.35);transition:transform .18s}
.sw[aria-checked=true]{background:var(--blue);border-color:var(--blue)}
.sw[aria-checked=true]::after{transform:translateX(22px)}
.plabel{flex:1;min-width:0;overflow-wrap:anywhere}
.rr{display:inline-flex;align-items:center;gap:10px;flex:none}

.qa{gap:8px}
.qa .btn{flex:1;white-space:nowrap;padding:12px 4px;font-size:15px}
</style></head><body><header><div class="head"><div><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3h5M10.5 3v6.1L5.3 18a2 2 0 0 0 1.7 3h10a2 2 0 0 0 1.7-3l-5.2-8.9V3"/><path d="M7.7 15h8.6"/></svg>Peptide Tracker</div><div class="small" id="clock"></div></div><select id="who" class="pill" onchange="setWho(this.value)"><option value="c">Carlos</option><option value="k">Kathy</option></select></div></header><main id="app"></main><nav id="nav"></nav><dialog id="dlg"><div class="modal-top"><span>Peptide Tracker</span><button type="button" class="modal-x" onclick="dismissModal()" aria-label="Cerrar">×</button></div><div id="modal"></div><div class="modal-footer"><button type="button" class="modal-cancel" onclick="dismissModal()">Cancelar y cerrar</button></div></dialog><script>
const KEY='pt_v1_demo';const initial=()=>({who:'c',weights:{c:[],k:[]},products:{c:[],k:[]},peptides:{c:[],k:[]},shots:[],events:[],vials:[],habits:{},goals:{c:null,k:null}});
if(!Array.prototype.at)Array.prototype.at=function(i){i=Math.trunc(i)||0;if(i<0)i+=this.length;return this[i]};let db,raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}try{db=raw?JSON.parse(raw):initial()}catch(e){try{localStorage.setItem(KEY+'_corrupt',raw)}catch(_){}db=initial()}if(!db||typeof db!=='object')db=initial();let page='today';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No se pudieron guardar los datos en este navegador. Exporte un respaldo antes de continuar.')}};const W=()=>db.who;const localDay=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>localDay();const now=()=>new Date().toISOString();const dateTime=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};const dateStr=s=>new Date(s+'T12:00').toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'});const n=v=>Number(v||0);const fmt=v=>n(v).toLocaleString('es-CR',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2,10);const eventList=()=>db.events.filter(e=>e.who===W()).sort((a,b)=>b.at.localeCompare(a.at));const products=()=>db.products[W()];const peps=()=>db.peptides[W()];const hkey=(day,k)=>W()+':'+day+':'+k;const hv=(day,k)=>db.habits[hkey(day,k)]??null;const changeHabit=(day,k,v)=>{const key=hkey(day,k);if(db.habits[key]===v)delete db.habits[key];else db.habits[key]=v;save();render()};const card=(title,body)=>`<section class="card"><h3>${title}</h3>${body}</section>`;const btn=(label,fn,cl='btn')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;const opts=(list)=>list.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');const input=(name,type='text',val='',extra='')=>{const num=type==='number';return `<label>${name}<input class="field" name="${name}" type="${num?'text':type}" ${num?`inputmode="${/días|minutos/.test(name)?'numeric':'decimal'}" data-num="1" autocomplete="off"`:''} value="${esc(val)}" ${extra}></label>`};const open=(html)=>{const d=document.getElementById('dlg');if(d.open)d.close();document.getElementById('modal').innerHTML=html;try{d.showModal()}catch(e){d.setAttribute('open','')}d.scrollTop=0};const close=()=>{const d=document.getElementById('dlg');try{d.close()}catch(e){}d.removeAttribute('open')};window.dismissModal=close;document.getElementById('dlg').addEventListener('click',e=>{if(e.target!==e.currentTarget)return;const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dismissModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')dismissModal()});document.getElementById('dlg').addEventListener('cancel',e=>{e.preventDefault();dismissModal()});const field=(f,k)=>{const e=f.elements.namedItem(k);let v=e.value;if(e.dataset&&e.dataset.num){v=v.trim().replace(',','.');if(v!==''&&!/^(\d+\.?\d*|\.\d+)$/.test(v))v=''}return v};const heading=(title)=>`<h2>${title}</h2>`;const weights=()=>db.weights[W()].slice().sort((a,b)=>a[0].localeCompare(b[0]));const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);
function setWho(w){db.who=w;save();render()}function go(p){page=p;render()}function render(){document.getElementById('who').value=W();document.getElementById('clock').textContent=new Date().toLocaleString('es-CR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});const pages={today:todayPage,progress:progressPage,peptides:peptidePage,inventory:inventoryPage,settings:settingsPage};document.getElementById('app').innerHTML=pages[page]();document.getElementById('nav').innerHTML=[['today','⌂','Mi día'],['progress','▥','Reportes'],['peptides','◉','Péptidos'],['inventory','◈','Inventario'],['settings','⚙','Config.']].map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${l}</button>`).join('')}
function checkRow(day,key,label){let v=hv(day,key);return `<div class="row item"><span>${esc(label)}</span><div>${btn(v===true?'✓ Sí':'Sí',`changeHabit('${day}','${key}',true)`,v===true?'btn':'btn secondary')} ${btn(v===false?'✕ No':'No',`changeHabit('${day}','${key}',false)`,v===false?'btn danger':'btn secondary')}</div></div>`}
function todayPage(){let day=today(),ws=weights(),last=ws.at(-1),todayEvents=eventList().filter(e=>e.at.slice(0,10)===day),meals=['Desayuno','Merienda AM','Almuerzo','Merienda PM','Cena'];let pToday=products().filter(p=>p.active!==false);let meds=pToday.filter(p=>p.type==='Medicamento'),supp=pToday.filter(p=>p.type==='Suplemento');return heading('Mi día · '+(W()==='c'?'Carlos':'Kathy'))+stockAlert()+card('Registro rápido',`<div class="row"><div><div class="muted">Último peso</div><div class="big">${last?fmt(last[1])+' kg':'—'}</div></div>${btn('+ Peso','weightForm()')}</div><div class="row qa" style="margin-top:14px">${btn('+ Síntoma','symptomForm()','btn secondary')}${btn('+ Entreno','trainingForm()','btn secondary')}${btn('+ Nota','noteForm()','btn secondary')}</div>`)+card('Hábitos de hoy',checkRow(day,'water','Hidratación cumplida')+meals.map((x,i)=>checkRow(day,'meal'+i,x)).join('')+checkRow(day,'supp','Suplementos del día'))+card('Medicamentos y suplementos',`<div class="muted">Active el interruptor cuando lo tome. Toque Editar para cambiarlo, moverlo al otro perfil o eliminarlo.</div>${pToday.length?pToday.map(p=>prodRow(day,p)).join(''):'<p class="muted">Todavía no hay productos activos. Agregue los que toma actualmente.</p>'}${btn('+ Agregar producto','productForm()','btn secondary')}`)+card('Actividad cronológica',`<div class="row">${btn('+ Registrar evento','eventMenu()','btn secondary')}<span class="muted">${todayEvents.length} eventos</span></div>${todayEvents.length?todayEvents.map(eventHTML).join(''):'<p class="muted">Aún no hay eventos registrados hoy. Puede agregar varios a lo largo del día.</p>'}`)+card('Aplicaciones próximas',peps().filter(p=>p.active).map(p=>`<div class="item"><b>${esc(p.name)}</b><div class="muted">Cada ${p.days} día(s) desde ${dateStr(p.start)} · referencia registrada ${fmt(p.dose)} ${p.unit}</div>${upcomingHTML(p)}${siteHint()}${btn('+ Registrar aplicación',`shotForm('${p.id}')`,'btn secondary')}</div>`).join('')||'<p class="muted">Sin péptidos activos.</p>')}

portData(ev){let file=ev.target.files[0];if(!file)return;if(file.size>5*1024*1024){alert('El respaldo supera 5 MB');return;}let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||typeof v!=='object'||!['c','k'].includes(v.who)||!v.weights||!Array.isArray(v.weights.c)||!Array.isArray(v.weights.k)||!v.peptides||!Array.isArray(v.peptides.c)||!Array.isArray(v.peptides.k)||!v.products||!Array.isArray(v.products.c)||!Array.isArray(v.products.k)||!Array.isArray(v.events)||!Array.isArray(v.shots)||!Array.isArray(v.vials)||!v.habits||typeof v.habits!=='object'||!v.goals)throw Error('Formato de respaldo inválido');if(confirm('¿Reemplazar los datos actuales por este respaldo? Se guardará una copia de los actuales para poder deshacer.')){try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(e){}db=normalize(v);unlocked.clear();save();render()}}catch(e){alert(e.message)}};r.readAsText(file)}function resetDemo(){if(confirm('¿Borrar TODOS los registros locales y restaurar el ejemplo?')){try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(e){}db=normalize(initial());unlocked.clear();save();render()}}

function setPin(ev){ev.preventDefault();const v=field(ev.target,'PIN (4 a 8 dígitos)');if(!/^\d{4,8}$/.test(v))return alert('El PIN debe tener de 4 a 8 dígitos');const r=new Uint8Array(8);try{crypto.getRandomValues(r)}catch(e){r.forEach((_,i)=>r[i]=Math.random()*256)}const rc=[...r].map(x=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[x%31]).join('');db.sec[W()]={pin:hs('p'+v),rec:hs('r'+rc)};unlocked.add(W());save();render();open(`<h3>Código de recuperación</h3><p class="muted">Anótelo ahora. Es la única forma de recuperar el acceso si olvida el PIN.</p><p class="big mint" style="letter-spacing:3px">${rc}</p>${btn('Ya lo guardé','dismissModal()','btn full')}`)}

const SITES={'abd-ii':['Abdomen inferior izquierdo',82,148],'mus-d':['Muslo derecho',121,212],'bra-i':['Brazo izquierdo',44,87],'abd-sd':['Abdomen superior derecho',118,112],'mus-i':['Muslo izquierdo',79,212],'bra-d':['Brazo derecho',156,87],'abd-id':['Abdomen inferior derecho',118,148],'abd-si':['Abdomen superior izquierdo',82,112]};

function vialSVG(v,s){const H=150,Y=46,T=v.total>0?v.total:1,L=s.pct/100*H,lvl=Y+H-L,low=isLow(v,s),g1=low?'#f7c35a':'#5b8dff',g2=low?'#e08a00':'#1b4fe0';let acc=0,bands='',ticks='';db.shots.filter(x=>x.vial===v.id).sort((a,b)=>a.at.localeCompare(b.at)).forEach((x,i)=>{const h=Math.min(shotMg(x)/T*H,H-acc);bands+=`<rect x="18" y="${Y+acc}" width="68" height="${h}" fill="${i%2?'#eef3fa':'#e3eaf5'}"/>`;acc+=h});for(let m=0;m<=T;m+=T>=20?5:1){const y=Y+H-m/T*H,big=m%10===0;ticks+=`<line x1="86" y1="${y}" x2="${big?93:90}" y2="${y}" stroke="#8a9ab0"/>${big?`<text x="96" y="${y+3}">${m}</text>`:''}`}return `<svg class="vial" viewBox="0 0 130 214" role="img" aria-label="Vial: quedan ${fmt(s.remaining)} mg"><defs><linearGradient id="lg${v.id}" x1="0" x2="1"><stop offset="0" stop-color="${g1}"/><stop offset=".55" stop-color="${g2}"/><stop offset="1" stop-color="${g2}"/></linearGradient><clipPath id="vc${v.id}"><rect x="18" y="${Y}" width="68" height="${H}" rx="12"/></clipPath></defs><rect x="30" y="4" width="44" height="14" rx="4" fill="#a9b7ca"/><rect x="26" y="16" width="52" height="10" rx="3" fill="#8396b0"/><rect x="34" y="26" width="36" height="20" fill="#f6f9fd" stroke="#a4b3c8"/><g clip-path="url(#vc${v.id})"><rect x="18" y="${Y}" width="68" height="${H}" fill="#f8fbff"/>${bands}<rect class="liq" x="18" y="${lvl}" width="68" height="${L}" fill="url(#lg${v.id})"/><rect x="18" y="${lvl}" width="68" height="3" fill="#fff" opacity=".35"/></g><rect x="18" y="${Y}" width="68" height="${H}" rx="12" fill="none" stroke="#8da0bb" stroke-width="2"/><rect x="24" y="${Y+8}" width="5" height="${H-16}" rx="2.5" fill="#fff" opacity=".5"/>${ticks}</svg>`}
function inventoryPage(){const vs=db.vials.filter(v=>v.owner===W()||v.shared);return heading('Inventario de viales')+stockAlert()+`<p class="muted">Los viales son privados por defecto. Se pueden compartir individualmente entre Carlos y Kathy. El nivel baja con cada aplicación registrada.</p>`+(vs.map(v=>{const s=vialStats(v),est=s.remaining<=0?'Agotado':s.days===null?'Sin proyección':new Date(Date.now()+s.days*864e5).toLocaleDateString('es-CR',{day:'numeric',month:'short'})+' (~'+s.days+' d)';return card(esc(v.label)+(v.owner!==W()?' <span class="chip">de '+NAME[v.owner]+'</span>':''),`<div class="vialwrap">${vialSVG(v,s)}<div class="vialinfo"><div class="big">${fmt(s.remaining)} mg</div><div class="muted">de ${fmt(v.total)} mg · ${v.shared?'Compartido':'Individual'}${v.opened?' · abierto '+dateStr(v.opened):''}</div><p class="muted">Consumido: <b>${fmt(s.used)} mg</b>${v.shared?'<br>Carlos '+fmt(s.by.c)+' mg · Kathy '+fmt(s.by.k)+' mg':''}<br>Se agota: <b>${est}</b>${n(v.loss)?'<br>Pérdida/ajuste: '+fmt(v.loss)+' mg':''}</p></div></div><p class="muted">La proyección usa la última cantidad aplicada y la frecuencia de cada péptido activo; no incluye pérdidas no registradas.</p>${v.owner===W()?btn('Editar vial',`editVial('${v.id}')`,'btn secondary'):''}`)}).join('')||'<p class="muted">Aún no hay viales.</p>')+card('Nuevo vial',btn('+ Agregar vial','vialForm()','btn full'))}

/* ===== v5: inventario por puestas, interruptores, edición en Mi día, TLP ===== */
const alertPuestas=()=>Number.isFinite(+db.alertPuestas)&&+db.alertPuestas>=1?Math.round(+db.alertPuestas):2;

/* --- plan de puestas: recorre el calendario de cada péptido activo y descuenta del inventario --- */
function planStock(rem,users,name,extra){
  const items=[];
  users.forEach(u=>db.peptides[u].forEach(p=>{
    if(!p.active||!(p.days>0)||p.name!==name)return;
    const dose=mg(lastDose(p),p.unit);if(!(dose>0))return;
    let d=nextDue(p);for(let i=0;i<80;i++){items.push({d,u,dose,nm:NAME[u]});d=addD(d,p.days)}
  }));
  if(extra&&extra.dose>0)[...new Set(items.map(i=>i.d))].forEach(d=>items.push({d,u:'p',dose:extra.dose,nm:extra.name}));
  if(!items.length)return null;
  const by={};items.forEach(i=>(by[i.d]=by[i.d]||[]).push(i));
  const dates=Object.keys(by).sort();
  let left=rem,covered=0,puestas=0,full=0,last=null,short=null;const sizes=new Set();let rsample=null;
  for(const d of dates){
    const g=by[d],need=g.reduce((a,x)=>a+x.dose,0);
    if(need<=left+1e-9){left-=need;covered++;puestas+=g.length;full+=g.length;sizes.add(g.length);if(g.length>1&&!rsample)rsample=g;last=d}
    else{let l=left,k=0;g.slice().sort((a,b)=>a.dose-b.dose).forEach(x=>{if(x.dose<=l+1e-9){l-=x.dose;k++}});short={d,need,fit:k,of:g.length,g};puestas+=k;break}
    if(covered>=60)break;
  }
  return{covered,puestas,full,mixed:sizes.size>1,last,short,left,rem,sample:rsample||by[dates[0]]};
}
function planText(pl,rem){
  if(rem!==undefined&&rem<=1e-9)return '<b>Agotado.</b> No alcanza para ninguna puesta.';
  if(!pl)return 'Sin proyección: falta un péptido activo con frecuencia configurada.';
  const g=pl.sample,multi=g.length>1,who=x=>x.map(y=>(y.nm||NAME[y.u])+' '+fmt(y.dose)).join(' + ');
  let t='';
  if(pl.covered>0){
    const rondas=multi&&!pl.mixed,cnt=rondas?pl.covered:pl.full,noun=rondas?(cnt===1?'ronda completa':'rondas completas'):(cnt===1?'puesta':'puestas');
    t+=`Alcanza para <b>${cnt}${pl.covered>=60?'+':''} ${noun}</b>`+(rondas?` (${who(g)} = ${fmt(g.reduce((a,x)=>a+x.dose,0))} mg por ronda)`:'')+(pl.last?`, hasta el ${dateStr(pl.last)}.`:'.');
  }
  if(pl.short){
    const s=pl.short,names=who(s.g);
    t+=(t?' ':'')+(s.fit===0
      ?`La puesta del ${dateStr(s.d)} (${names} = ${fmt(s.need)} mg) ya no alcanza. Compre antes de esa fecha.`
      :`La puesta del ${dateStr(s.d)} necesita ${fmt(s.need)} mg (${names}) y solo alcanza para <b>${s.fit} de ${s.of}</b>. Compre antes de esa fecha.`);
  }
  return t;
}
function vialStats(v){
  const by={c:0,k:0};let used=0;
  db.shots.filter(s=>s.vial===v.id).forEach(s=>{const x=shotMg(s);used+=x;by[s.who]=(by[s.who]||0)+x});
  const other=Number(v.other)||0,remaining=Math.max(0,v.total-used-other-n(v.loss)),base=pOf(v.pid);
  const users=db.owner?[db.owner]:(v.shared?['c','k']:[v.owner]);
  const ex=db.owner&&v.shared&&Number(v.pdose)>0?{dose:Number(v.pdose),name:v.pname||'Otra persona'}:null;
  const plan=base?planStock(remaining,users,base.name,ex):null;
  return{used,other,by,remaining,plan,pct:v.total>0?Math.min(100,remaining/v.total*100):0};
}
const isLow=(v,s=vialStats(v))=>s.remaining<=0||(!!s.plan&&s.plan.covered<=alertPuestas());
function stockByPeptide(){
  const names={};
  db.vials.filter(v=>v.owner===W()||v.shared).forEach(v=>{
    const b=pOf(v.pid);if(!b)return;
    const o=names[b.name]=names[b.name]||{rem:0,users:new Set(),count:0,ex:null};
    o.rem+=vialStats(v).remaining;o.count++;
    if(db.owner){o.users.add(db.owner);const pd=Number(v.pdose)||0;if(v.shared&&pd>0&&(!o.ex||pd>o.ex.dose))o.ex={dose:pd,name:v.pname||'Otra persona'}}
    else(v.shared?['c','k']:[v.owner]).forEach(u=>o.users.add(u));
  });
  return Object.entries(names).map(([nm,o])=>({nm,rem:o.rem,count:o.count,pl:planStock(o.rem,[...o.users],nm,o.ex)}));
}
function stockAlert(){
  return stockByPeptide().filter(o=>o.rem<=1e-9||(o.pl&&o.pl.covered<=alertPuestas()))
    .map(o=>`<div class="alert"><b>⚠ ${esc(o.nm)}: poco inventario</b><div>Total en viales: ${fmt(o.rem)} mg. ${planText(o.pl,o.rem)}</div></div>`).join('');
}
const alertCard=()=>`<p class="muted">Se avisa en Mi día e Inventario cuando el inventario de un péptido alcance para este número de puestas o menos. Con puestas semanales, 2 equivale a unas dos semanas.</p><label>Puestas de aviso<input class="field" type="number" inputmode="numeric" min="1" max="20" value="${alertPuestas()}" onchange="setAlert(this.value)"></label>`;
function setAlert(x){const v=Math.round(+x);if(!(v>=1&&v<=20))return alert('Use un número entre 1 y 20.');db.alertPuestas=v;save();render()}

function inventoryPage(){
  const vs=db.vials.filter(v=>v.owner===W()||v.shared),tot=stockByPeptide().filter(o=>o.count>1);
  return heading('Inventario de viales')+stockAlert()
    +`<p class="muted">${db.owner?'Estos viales son suyos. Si comparte uno con otra persona, anote aparte lo que ella usa: sus datos personales no se guardan aquí. ':'Los viales son privados por defecto. Se pueden compartir individualmente entre Carlos y Kathy. '}El nivel baja con cada aplicación registrada.</p>`
    +(tot.length?card('Existencias totales',tot.map(o=>`<div class="item"><b>${esc(o.nm)}</b> · ${fmt(o.rem)} mg en ${o.count} viales<div class="plan">${planText(o.pl,o.rem)}</div></div>`).join('')):'')
    +(vs.map(v=>{const s=vialStats(v);return card(esc(v.label)+(v.owner!==W()?' <span class="chip">de '+NAME[v.owner]+'</span>':''),
      `<div class="vialwrap">${vialSVG(v,s)}<div class="vialinfo"><div class="big">${fmt(s.remaining)} mg</div><div class="muted">de ${fmt(v.total)} mg · ${v.shared?'Compartido':'Individual'}${v.opened?' · abierto '+dateStr(v.opened):''}</div><p class="muted">Consumido: <b>${fmt(s.used+s.other)} mg</b>${db.owner?(v.shared?`<br>Usted ${fmt(s.used)} mg · ${esc(v.pname||'Otra persona')} ${fmt(s.other)} mg`:''):(v.shared?'<br>Carlos '+fmt(s.by.c)+' mg · Kathy '+fmt(s.by.k)+' mg':'')}${n(v.loss)?'<br>Pérdida/ajuste: '+fmt(v.loss)+' mg':''}</p></div></div>`
      +`<div class="plan">${planText(s.plan,s.remaining)}</div><p class="muted">Se calcula con las próximas fechas de cada péptido activo y la última cantidad aplicada. No incluye pérdidas no registradas.${db.owner&&v.shared&&Number(v.pdose)>0?' Se supone que la otra persona se aplica el mismo día que usted.':''}</p>`
      +partnerBlock(v)+(v.owner===W()?btn('Editar vial',`editVial('${v.id}')`,'btn secondary'):''))}).join('')||'<p class="muted">Aún no hay viales.</p>')
    +card('Nuevo vial',btn('+ Agregar vial','vialForm()','btn full'));
}
function partnerBlock(v){
  if(!(db.owner&&v.shared&&v.owner===W()))return '';
  const nm=esc(v.pname||'Otra persona'),pd=Number(v.pdose)||0;
  return `<div style="display:grid;gap:8px;margin:12px 0">${pd>0?`<button type="button" class="btn secondary full" onclick="partnerAdd('${v.id}')">+ ${nm} se aplicó ${fmt(pd)} mg</button>`:''}<button type="button" class="btn outline full" onclick="partnerForm('${v.id}')">${pd>0?'Ajustar uso de '+nm:'Datos de '+nm}</button></div>`;
}
function partnerAdd(vid){const v=db.vials.find(x=>x.id===vid);if(!v)return;const pd=Number(v.pdose)||0;if(!(pd>0))return partnerForm(vid);if(!confirm('¿Anotar que '+(v.pname||'la otra persona')+' se aplicó '+fmt(pd)+' mg de este vial?'))return;v.other=(Number(v.other)||0)+pd;save();render()}
function partnerForm(vid){const v=db.vials.find(x=>x.id===vid);if(!v)return;open(`<h3>Uso de la otra persona</h3><p class="muted">El vial es compartido, pero los datos de la otra persona no se guardan aquí. Anote solo cuánto usa de este vial.</p><form onsubmit="savePartner(event,'${vid}')">${input('Nombre','text',v.pname||'','maxlength="30"')}${input('Cantidad por puesta (mg)','number',v.pdose||'','min="0" step="any"')}${input('Ya usado de este vial por esa persona (mg)','number',Number(v.other)||0,'min="0" step="any"')}${btn('Guardar','','btn full')}</form>`)}
function savePartner(e,vid){e.preventDefault();const v=db.vials.find(x=>x.id===vid),f=e.target;if(!v)return;v.pname=field(f,'Nombre').trim()||'Otra persona';v.pdose=Math.max(0,Number(field(f,'Cantidad por puesta (mg)'))||0);v.other=Math.max(0,Number(field(f,'Ya usado de este vial por esa persona (mg)'))||0);save();close();render()}
function shotForm(pid,sid){
  const p=pOf(pid),sh=sid?db.shots.find(x=>x.id===sid):null,vs=db.vials.filter(v=>sameComp(v,p)&&(v.owner===W()||v.shared));

  const sel=sh?(sh.site||''):siteInfo().sug;
  open(`<h3>${sh?'Editar':'Registrar'} aplicación · ${esc(p.name)}</h3><form onsubmit="addShot(event,'${pid}'${sh?`,'${sid}'`:''})">${input('Fecha y hora','datetime-local',sh?sh.at.slice(0,16):dateTime(),'required')}<p class="muted">Unidad: ${p.unit}</p>${input('Cantidad aplicada','number',sh?sh.dose:lastDose(p),'min="0" step="any" required')}<label>Vial de origen<select class="field" name="vial"><option value="">Sin asociar a inventario</option>${vs.map(v=>`<option value="${v.id}" ${auto===v.id?'selected':''}>${esc(v.label)} · ${fmt(vialStats(v).remaining)} mg disp.</option>`).join('')}</select></label><h4>Sitio de aplicación</h4>${siteMap(sel)}${btn(sh?'Guardar cambios':'Registrar aplicación','','btn full')}</form>${sh?`<p>${btn('Eliminar aplicación',`deleteShot('${sid}')`,'btn danger full')}</p>`:''}`);

/* --- interruptores (siempre en No; se activan tocando o deslizando) --- */
function setHabit(day,key,on){const k=hkey(day,key);if(on)db.habits[k]=true;else delete db.habits[k];save()}
const swHTML=(day,key)=>{const on=hv(day,key)===true;return `<span class="swrap"><span class="swt${on?' on':''}">${on?'Sí':'No'}</span><button type="button" class="sw" role="switch" aria-checked="${on}" aria-label="Activar" data-day="${day}" data-key="${esc(key)}" onclick="swClick(this)" onpointerdown="swDown(event)" onpointerup="swUp(event,this)" onpointercancel="swX=null"></button></span>`};
let swX=null,swSkip=null;
function swDown(e){swX=e.clientX}
function swUp(e,b){if(swX===null)return;const dx=e.clientX-swX;swX=null;if(Math.abs(dx)>14){swSkip=b;swSet(b,dx>0);setTimeout(()=>{if(swSkip===b)swSkip=null},300)}}
function swClick(b){if(swSkip===b){swSkip=null;return}swSet(b,b.getAttribute('aria-checked')!=='true')}
function swSet(b,on){setHabit(b.dataset.day,b.dataset.key,on);b.setAttribute('aria-checked',String(on));const t=b.parentNode.querySelector('.swt');if(t){t.textContent=on?'Sí':'No';t.classList.toggle('on',on)}}
function checkRow(day,key,label){return `<div class="row item"><span class="plabel">${esc(label)}</span>${swHTML(day,key)}</div>`}
const prodRow=(day,p)=>`<div class="row item"><span class="plabel">${esc(p.name)}${p.time?' · '+esc(p.time):''}<span class="muted" style="display:block">${esc(p.type)}</span></span><span class="rr"><button type="button" class="btn tiny" onclick="productEdit('${p.id}')">Editar</button>${swHTML(day,'prod'+p.id)}</span></div>`;

/* --- TLP: registro guiado de emociones (5 preguntas, basado en habilidades de descripción de emociones de DBT) --- */
const EMO=['Tristeza','Enojo','Miedo / ansiedad','Vergüenza','Culpa','Soledad / vacío','Celos','Rechazo / abandono','Frustración','Alegría','Calma'];
const PATS=['Me van a abandonar','Todo o nada','Leer la mente','Siempre / nunca','Es mi culpa','Me rechazan','No valgo','Lo peor va a pasar'];
const BODYS=['Opresión en el pecho','Nudo en el estómago','Calor / rubor','Temblor','Corazón acelerado','Tensión muscular','Cansancio','Entumecimiento'];
const URGES=['Aislarme','Discutir / gritar','Huir o cortar la relación','Buscar seguridad o confirmación','Comer, gastar o consumir de más','Hacerme daño','Ninguno'];
const COPES=['Respirar / hacer una pausa','Hablar con alguien','Moverme o caminar','Acción opuesta','Escribir','Distraerme','Contacté a mi terapeuta','Nada todavía'];
const intLbl=v=>v<=0?'Nada':v<=3?'Leve':v<=6?'Moderada':v<=8?'Fuerte':'Muy intensa';
let md=null,mdStep=1,moodDirty=false,mdMax=20,askAt=0;
const mdMore=()=>{mdMax+=20;render()};
const mChips=(f,list,max)=>`<div class="chips">${list.map(x=>`<button type="button" class="chip${md[f].includes(x)?' on':''}" data-v="${esc(x)}" onclick="mdToggle('${f}',this,${max||0})">${esc(x)}</button>`).join('')}</div>`;
function mdMsg(t){const e=document.getElementById('mwmsg');if(!e)return;e.textContent=t;setTimeout(()=>{if(e.textContent===t)e.textContent=''},2600)}
function mdToggle(f,b,max){const v=b.dataset.v,a=md[f],i=a.indexOf(v);if(i>=0){a.splice(i,1);b.classList.remove('on')}else{if(max&&a.length>=max){mdMsg('Puede elegir hasta '+max+'.');return}a.push(v);b.classList.add('on')}moodDirty=true;if(f==='urge')mdCare()}
function mdCare(){const e=document.getElementById('mdcare');if(e)e.innerHTML=md.urge.includes('Hacerme daño')?`<div class="care"><b>Gracias por anotarlo.</b> Si siente que no puede mantenerse a salvo, pida ayuda ahora: llame al <b>911</b> o a la línea de apoyo psicológico <b>1322</b> (gratuita, 24 horas), y avise a una persona de confianza.</div>`:''}
function mdGo(d){if(mdStep===1&&d>0&&!md.emotions.length&&!md.other.trim()){mdMsg('Elija al menos una emoción para continuar.');return}mdStep=Math.min(5,Math.max(1,mdStep+d));mdRender()}
function mdAfterClear(){md.after=null;moodDirty=true;const e=document.getElementById('ma');if(e)e.textContent='sin registrar'}
function mdRender(){
  const el=document.getElementById('mw');if(!el)return;const S=mdStep;
  const T=['','¿Qué estoy sintiendo?','¿Qué pasó justo antes?','¿Qué historia me conté?','¿Qué sentí en el cuerpo y qué impulso tuve?','¿Qué hice y qué necesito ahora?'][S];
  const H=['','Ponerle nombre a la emoción ya ayuda a regularla. Elija hasta 3 y marque qué tan fuerte es.','Describa solo los hechos, como los grabaría una cámara: qué pasó, quién estaba, dónde y cuándo. Las interpretaciones van en el siguiente paso.','Un pensamiento es una interpretación, no siempre un hecho. Anote qué pensó sobre lo ocurrido, sobre usted o sobre la otra persona.','Las emociones se sienten en el cuerpo y empujan a actuar. Reconocer el impulso permite elegir qué hacer con él.','Anote qué hizo, o qué haría, y cómo quedó la intensidad. Así se ve qué le ayuda.'][S];
  let b='';
  if(S===1)b=`<label>Fecha y hora<input class="field" type="datetime-local" value="${esc(md.at)}" oninput="md.at=this.value;moodDirty=true"></label>${mChips('emotions',EMO,3)}<label>Otra emoción (opcional)<input class="field" type="text" maxlength="40" value="${esc(md.other)}" oninput="md.other=this.value;moodDirty=true"></label><label>Intensidad ahora: <b id="mi">${md.intensity} · ${intLbl(md.intensity)}</b><input type="range" min="0" max="10" step="1" value="${md.intensity}" style="width:100%" oninput="md.intensity=+this.value;moodDirty=true;document.getElementById('mi').textContent=this.value+' · '+intLbl(+this.value)"></label>`;
  if(S===2)b=`<label>Situación (hechos)<textarea class="field" rows="5" oninput="md.trigger=this.value;moodDirty=true">${esc(md.trigger)}</textarea></label>`;
  if(S===3)b=`<label>Lo que pensé<textarea class="field" rows="4" oninput="md.thought=this.value;moodDirty=true">${esc(md.thought)}</textarea></label><label>¿Se parece a alguno de estos pensamientos? (opcional)</label>${mChips('patterns',PATS,0)}<label>¿Qué hechos lo apoyan y cuáles lo contradicen? (opcional)<textarea class="field" rows="3" oninput="md.facts=this.value;moodDirty=true">${esc(md.facts)}</textarea></label>`;
  if(S===4)b=`<label>En el cuerpo</label>${mChips('body',BODYS,0)}<label>Impulso: ¿qué me dieron ganas de hacer?</label>${mChips('urge',URGES,0)}<div id="mdcare"></div>`;
  if(S===5)b=`<label>Lo que hice o haría<textarea class="field" rows="4" oninput="md.did=this.value;moodDirty=true">${esc(md.did)}</textarea></label><label>Recursos que usé o podría usar</label>${mChips('coping',COPES,0)}<label>Intensidad después: <b id="ma">${md.after===null?'sin registrar':md.after+' · '+intLbl(md.after)}</b><input type="range" min="0" max="10" step="1" value="${md.after===null?md.intensity:md.after}" style="width:100%" oninput="md.after=+this.value;moodDirty=true;document.getElementById('ma').textContent=this.value+' · '+intLbl(+this.value)"></label><button type="button" class="btn tiny" onclick="mdAfterClear()">Dejar sin registrar</button>`;
  el.innerHTML=`<div class="steps">${[1,2,3,4,5].map(i=>`<i class="${i<=S?'on':''}"></i>`).join('')}</div><div class="muted">Paso ${S} de 5</div><h3>${T}</h3><p class="hint">${H}</p><p id="mwmsg" class="muted"></p>${b}<div class="row wnav">${S>1?'<button type="button" class="btn secondary" onclick="mdGo(-1)">‹ Atrás</button>':''}${S<5?'<button type="button" class="btn" onclick="mdGo(1)">Siguiente ›</button>':'<button type="button" class="btn on" onclick="mdSave()">Guardar</button>'}</div>${S<5?'<button type="button" class="btn outline full" onclick="mdSave()">Guardar ahora y terminar</button>':''}${md.id&&S===5?`<p><button type="button" class="btn danger full" onclick="moodDelete('${md.id}')">Eliminar registro</button></p>`:''}`;
  if(S===4)mdCare();
  document.getElementById('dlg').scrollTop=0;
}
function moodOpen(id){
  const e=id?db.mood.find(x=>x.id===id):null;
  md=e?{id:e.id,who:e.who,at:e.at,emotions:e.emotions.filter(x=>EMO.includes(x)),other:e.emotions.filter(x=>!EMO.includes(x)).join(', '),intensity:e.intensity,trigger:e.trigger||'',thought:e.thought||'',facts:e.facts||'',patterns:[...(e.patterns||[])],body:[...(e.body||[])],urge:[...(e.urge||[])],did:e.did||'',coping:[...(e.coping||[])],after:e.after==null?null:e.after}
   :{id:null,who:W(),at:dateTime(),emotions:[],other:'',intensity:5,trigger:'',thought:'',facts:'',patterns:[],body:[],urge:[],did:'',coping:[],after:null};
  mdStep=1;moodDirty=false;open('<div id="mw"></div>');mdRender();
}
function mdSave(){
  const em=md.emotions.slice(),o=(md.other||'').trim();if(o)em.push(o);
  if(!em.length){mdStep=1;mdRender();mdMsg('Elija al menos una emoción para guardar.');return}
  const rec={id:md.id||id(),who:md.who||W(),at:md.at||dateTime(),emotions:em,intensity:md.intensity,trigger:md.trigger.trim(),thought:md.thought.trim(),facts:md.facts.trim(),patterns:md.patterns,body:md.body,urge:md.urge,did:md.did.trim(),coping:md.coping,after:md.after};
  const i=md.id?db.mood.findIndex(x=>x.id===md.id):-1;if(i>=0)db.mood[i]=rec;else db.mood.push(rec);
  moodDirty=false;save();close();render();
}
function moodDelete(mid){if(!confirm('¿Eliminar este registro de emoción?'))return;db.mood=db.mood.filter(x=>x.id!==mid);moodDirty=false;save();close();render()}
function moodView(mid){
  const e=db.mood.find(x=>x.id===mid);if(!e)return;
  const sec=(t,v)=>v&&v.length?`<h4>${t}</h4><p>${Array.isArray(v)?v.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):esc(v).replace(/\n/g,'<br>')}</p>`:'';
  moodDirty=false;
  open(`<h3>${e.emotions.map(esc).join(' · ')}</h3><p class="muted">${dateStr(e.at.slice(0,10))} · ${e.at.slice(11,16)} · intensidad ${e.intensity}/10 (${intLbl(e.intensity)})${e.after!=null?' → después '+e.after+'/10':''}</p>${sec('¿Qué pasó?',e.trigger)}${sec('Lo que pensé',e.thought)}${sec('Patrones de pensamiento',e.patterns)}${sec('Hechos a favor y en contra',e.facts)}${sec('En el cuerpo',e.body)}${sec('Impulsos',e.urge)}${sec('Lo que hice',e.did)}${sec('Recursos',e.coping)}<p>${btn('Editar',`moodOpen('${mid}')`,'btn secondary full')}</p><p>${btn('Eliminar registro',`moodDelete('${mid}')`,'btn danger full')}</p>`);
}
function moodChart(r,from){
  if(!r.length)return '<p class="muted">Aún no hay datos para la gráfica.</p>';
  const a=r.slice().sort((x,y)=>x.at.localeCompare(y.at)),t0=new Date(from+'T00:00').getTime(),t1=new Date(today()+'T23:59').getTime();
  const X=m=>Math.min(320,Math.max(40,40+(new Date(m.at).getTime()-t0)/(t1-t0)*280)),Y=v=>120-v/10*100,tx='fill="#5b6b80" font-size="10"';
  return `<svg viewBox="0 0 340 150" role="img" aria-label="Intensidad emocional"><line x1="40" y1="120" x2="325" y2="120" stroke="#c5d0e0"/><line x1="40" y1="70" x2="325" y2="70" stroke="#e6ecf5"/><line x1="40" y1="20" x2="325" y2="20" stroke="#e6ecf5"/><text x="34" y="24" text-anchor="end" ${tx}>10</text><text x="34" y="74" text-anchor="end" ${tx}>5</text><text x="34" y="124" text-anchor="end" ${tx}>0</text>${a.length>1?`<polyline points="${a.map(m=>X(m)+','+Y(m.intensity)).join(' ')}" fill="none" stroke="#1f55f2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}${a.map(m=>`<circle cx="${X(m)}" cy="${Y(m.intensity)}" r="4" fill="#1f55f2"/>`).join('')}<text x="40" y="144" ${tx}>${esc(dateStr(from))}</text><text x="325" y="144" text-anchor="end" ${tx}>Hoy</text></svg>`;
}
function tlpPage(){
  const l=db.mood.filter(m=>m.who===W()).sort((a,b)=>b.at.localeCompare(a.at)),from=addD(today(),-29),r=l.filter(m=>m.at.slice(0,10)>=from);
  const avg=r.length?r.reduce((a,m)=>a+m.intensity,0)/r.length:null,cnt={};r.forEach(m=>m.emotions.forEach(x=>{cnt[x]=(cnt[x]||0)+1}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  return heading('TLP · Emociones')+`<p class="muted">Anote lo que siente, qué pasó y qué hizo. Ver los patrones ayuda a entender la emoción y a llevarla a terapia. No sustituye a su terapeuta.</p>`+btn('+ Registrar emoción','moodOpen()','btn full')+'<div style="height:15px"></div>'
   +card('Últimos 30 días',`<div class="grid"><div class="stat"><span class="muted">Registros</span><b>${r.length}</b></div><div class="stat"><span class="muted">Intensidad media</span><b>${avg===null?'—':fmt(Math.round(avg*10)/10)}</b></div></div>${top?`<p class="muted">Emoción más frecuente: <b>${esc(top[0])}</b> (${top[1]} ${top[1]===1?'vez':'veces'})</p>`:''}${moodChart(r,from)}`)
   +card('Registros',`<div class="hist">${l.slice(0,mdMax).map(m=>`<div class="hrow"><div><div>${dateStr(m.at.slice(0,10))} · ${esc(m.emotions.join(', '))} · ${m.intensity}/10</div><div class="hsub">${esc((m.trigger||m.thought||'').slice(0,90))}</div></div>${btn('Ver',`moodView('${m.id}')`,'btn tiny')}</div>`).join('')||'<p class="muted">Aún no hay registros.</p>'}</div>`+(l.length>mdMax?btn('Ver más','mdMore()','btn secondary full'):''));
}
window.dismissModal=()=>{
  if(moodDirty&&document.getElementById('mw')){const t=Date.now();if(t-askAt<500)return;if(!confirm('¿Descartar este registro sin guardar?')){askAt=Date.now();return}askAt=Date.now()}
  moodDirty=false;close();
};


/* íconos de la barra inferior (trazo limpio, heredan el color) */
const _ni=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const NI={
  today:_ni('<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/>'),
  progress:_ni('<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>'),
  peptides:_ni('<circle cx="6.5" cy="7" r="2.4"/><circle cx="17.5" cy="7" r="2.4"/><circle cx="12" cy="17.5" r="2.4"/><path d="M8.9 7h6.2M8 9l2.6 6.3M16 9l-2.6 6.3"/>'),
  inventory:_ni('<path d="M9 3h6M10 3v3M14 3v3"/><path d="M8 6h8a1 1 0 0 1 1 1v12.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 19.5V7a1 1 0 0 1 1-1z"/><path d="M7 11h10M7 15h10"/>'),
  tlp:_ni('<path d="M12 20s-7.5-4.6-7.5-10.2A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 2.2C19.5 15.4 12 20 12 20z"/>'),
  settings:_ni('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>')
};
function render(){
  const y=window.scrollY,sel=document.getElementById('who');sel.value=W();
  if(db.owner&&db.who!==db.owner)db.who=db.owner;
  let tag=document.getElementById('whoTag');
  if(db.owner){sel.style.display='none';if(!tag){tag=document.createElement('span');tag.id='whoTag';tag.className='pill';tag.style.cssText='display:inline-flex;align-items:center;gap:6px';sel.parentNode.appendChild(tag)}tag.textContent=NAME[db.owner]}
  else{sel.style.display='';if(tag)tag.remove()}
  if(isLocked()){showLock();return}hideLock();
  if(!db.owner){ownerPicker();return}
  document.getElementById('clock').textContent=new Date().toLocaleString('es-CR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · v7';
  const pages={today:todayPage,progress:progressPage,peptides:peptidePage,inventory:inventoryPage,tlp:tlpPage,settings:settingsPage};
  document.getElementById('app').innerHTML=pages[page]();
  document.getElementById('nav').innerHTML=[['today',NI.today,'Mi día'],['progress',NI.progress,'Reportes'],['peptides',NI.peptides,'Péptidos'],['inventory',NI.inventory,'Inventario'],['tlp',NI.tlp,'TLP'],['settings',NI.settings,'Config.']].map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${l}</button>`).join('');
  scrollTo(0,y);
}

/* ===== v6: uso 100% personal (cada teléfono guarda solo a su dueño) ===== */
function ownerPicker(){
  document.getElementById('clock').textContent='Configuración inicial · v7';document.getElementById('who').style.display='none';
  document.getElementById('app').innerHTML=heading('¿De quién es este teléfono?')+`<p class="muted">La app es 100% personal: este teléfono guardará solo los datos de su dueño. Los datos de la otra persona no se muestran ni se guardan aquí.</p>`+btn('Es de Carlos',"setOwner('c')",'btn full')+'<div style="height:12px"></div>'+btn('Es de Kathy',"setOwner('k')",'btn full');
  document.getElementById('nav').innerHTML='';
}
function makePersonal(w){
  const o=other(w);
  const keep=[];
  db.vials.forEach(v=>{
    const base=pOf(v.pid);
    if(v.owner!==w&&!v.shared)return;                       /* vial privado de la otra persona: se descarta */
    const oth=db.shots.filter(s=>s.vial===v.id&&s.who===o).reduce((a,s)=>a+shotMg(s),0);
    if(oth>0)v.other=(Number(v.other)||0)+oth;               /* solo cuánto usó, sin su historial */
    if(v.shared&&!(Number(v.pdose)>0)&&base){
      const op=db.peptides[o].find(p=>p.name===base.name&&p.active!==false)||db.peptides[o].find(p=>p.name===base.name);
      if(op){const d=mg(lastDose(op),op.unit);if(d>0)v.pdose=d}
    }
    if(v.shared&&oth>0&&!v.pname)v.pname=NAME[o];
    if(v.owner===o){                                          /* vial de la otra persona compartido conmigo: pasa a ser mío */
      const mine=base&&db.peptides[w].find(p=>p.name===base.name);
      if(!mine)return;
      v.owner=w;v.pid=mine.id;if(!v.pname)v.pname=NAME[o];
    }
    keep.push(v);
  });
  db.vials=keep;
  db.shots=db.shots.filter(s=>s.who===w);
  db.events=db.events.filter(e=>e.who===w);
  db.mood=db.mood.filter(m=>m.who===w);
  db.weights[o]=[];db.products[o]=[];db.peptides[o]=[];db.goals[o]=null;
  Object.keys(db.habits).forEach(k=>{if(k.startsWith(o+':'))delete db.habits[k]});
  delete db.sec[o];
  db.owner=w;db.who=w;
}
function setOwner(w){
  const o=other(w),cnt=db.shots.filter(s=>s.who===o).length+db.events.filter(e=>e.who===o).length+db.weights[o].length+db.peptides[o].length+db.products[o].length+db.mood.filter(m=>m.who===o).length;
  if(cnt>0&&!confirm('Este teléfono quedará solo para '+NAME[w]+'. Se borrarán de aquí los datos de '+NAME[o]+' ('+cnt+' registros). ¿Continuar?'))return;
  makePersonal(w);
  try{localStorage.removeItem(KEY+'_prev');localStorage.removeItem(KEY+'_corrupt')}catch(e){}
  unlocked.clear();save();render();
}
function setWho(w){if(db.owner)return;db.who=w;save();render()}
function importData(ev){
  const file=ev.target.files[0];if(!file)return;
  if(file.size>5*1024*1024){alert('El respaldo supera 5 MB');return}
  const r=new FileReader();
  r.onload=()=>{try{
    const v=JSON.parse(r.result);
    if(!v||typeof v!=='object'||!['c','k'].includes(v.who)||!v.weights||!Array.isArray(v.weights.c)||!Array.isArray(v.weights.k)||!v.peptides||!Array.isArray(v.peptides.c)||!Array.isArray(v.peptides.k)||!v.products||!Array.isArray(v.products.c)||!Array.isArray(v.products.k)||!Array.isArray(v.events)||!Array.isArray(v.shots)||!Array.isArray(v.vials)||!v.habits||typeof v.habits!=='object'||!v.goals)throw Error('Formato de respaldo inválido');
    if(db.owner&&v.owner&&v.owner!==db.owner)throw Error('Este respaldo es de '+NAME[v.owner]+' y este teléfono es de '+NAME[db.owner]+'. No se puede importar aquí.');
    if(!confirm('¿Reemplazar los datos actuales por este respaldo? Se guardará una copia de los actuales para poder deshacer.'))return;
    try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(e){}
    const own=db.owner||v.owner||null;
    db=normalize(v);if(own)makePersonal(own);
    unlocked.clear();save();render();
  }catch(e){alert(e.message)}};
  r.readAsText(file);
}
function resetDemo(){
  if(!confirm('¿Borrar TODOS los registros locales de este teléfono?'))return;
  const o=db.owner;try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(e){}
  db=normalize(initial());if(o){db.owner=o;db.who=o}unlocked.clear();save();render();
}

render();
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171e23"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Peptides"><title>Peptide Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f1f7f4;background:#062d29}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#0b4038,#062d29 60%);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#082f2bdc;backdrop-filter:blur(16px);padding:18px 18px 12px;z-index:4;border-bottom:1px solid #25594e}.head{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:800;letter-spacing:-.5px}.small{font-size:12px;color:#9cbeb4}.pill{border:1px solid #3e8a78;border-radius:30px;padding:7px 12px;background:#124c41;color:#dffcf1}main{max-width:720px;margin:auto;padding:20px 16px 100px}.card{background:#17473eaa;border:1px solid #367b6c;border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 8px 24px #001b151a}.card h3{margin:0 0 12px;font-size:17px}.muted{color:#9fbdb4;font-size:13px}.big{font-size:34px;font-weight:800}.mint{color:#3fdbac}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#0b342e;border:1px solid #2d6a5d;border-radius:14px;padding:14px}.stat b{font-size:22px;display:block}.btn{background:#38d7a4;color:#042d26;border:0;border-radius:14px;padding:12px 15px;font-weight:750}.secondary{background:#25594e;color:#effff9}.danger{background:#703d42;color:white}.outline{background:transparent;color:#baf4dc;border:1px solid #4a9c82}.full{width:100%}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#052a26ed;display:flex;justify-content:space-around;border-top:1px solid #356a5c;padding:9px 5px max(12px,env(safe-area-inset-bottom))}nav button{border:0;background:none;color:#a7c3b9;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:5px;min-width:56px}nav button.active{color:#3de2ad;font-weight:750}nav span{font-size:20px}.field{display:block;width:100%;background:#0b342f;color:white;border:1px solid #4a8979;border-radius:12px;padding:12px;margin:7px 0 12px}label{font-size:13px;color:#b9d7cd}dialog{width:min(94vw,480px);border:1px solid #4a907c;border-radius:20px;background:#103c35;color:white;padding:20px;max-height:85vh;overflow:auto}dialog::backdrop{background:#001c18b9}.item{border-top:1px solid #37685b;padding:12px 0}.chip{display:inline-block;background:#245b4b;border-radius:30px;padding:5px 9px;font-size:12px;margin:3px}.check{width:21px;height:21px;accent-color:#36d9a5}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tabs button{white-space:nowrap}.bar{height:10px;background:#0a2b27;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#34d8a3}.hidden{display:none}h2{margin:4px 0 18px;font-size:25px}h4{margin:12px 0 8px}svg{max-width:100%}.notice{border-left:3px solid #e2b866;padding:9px 12px;background:#53452b66;border-radius:8px;font-size:12px;color:#f6e3ba;margin:10px 0}input[type=date]{color-scheme:dark}

/* Premium graphite UI / mobile dialog fixes */
:root{color:#eef2f4;background:#101519}body{background:linear-gradient(160deg,#171e23,#101519 65%);color:#eef2f4}header{background:#151d22f2;border-bottom-color:#2b343b}nav{background:#151d22f5;border-top-color:#303d43}.card{background:#202a30;border:1px solid #34434a;box-shadow:0 8px 22px #0002}.stat{background:#192329;border-color:#35434a}.muted,.small,label{color:#aebdc3}.pill,.secondary,.chip{background:#2a3b41;border-color:#45616a;color:#e8f5f1}.field{background:#172329;border-color:#52656b;color:#f5f8f8}.item{border-color:#35464c}.mint,nav button.active{color:#52d8b0}.bar{background:#111b20}.bar>div,.btn{background:#51cfa7}.btn{color:#102822}.outline{color:#9aecd2;border-color:#4d8c7b}.notice{background:#4b3c2755}dialog{position:fixed;inset:0;margin:auto;width:min(92vw,440px);max-height:min(78dvh,680px);padding:0 16px 14px;background:#222d33;border:1px solid #52676e;border-radius:22px;color:#f5f7f8;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 22px 70px #0009}dialog::backdrop{background:#050b0dcc;backdrop-filter:blur(4px)}.modal-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#222d33;padding:12px 0 8px;border-bottom:1px solid #3c4b51;font-size:12px;color:#aebfc5}.modal-x{border:1px solid #56686d;background:#354249;color:#fff;border-radius:50%;width:38px;height:38px;font-size:25px;line-height:1}.modal-footer{position:sticky;bottom:-14px;background:#222d33;padding:10px 0 5px}.modal-cancel{width:100%;background:#36444b;border:1px solid #56686d;color:#f0f4f5;border-radius:12px;padding:10px}#modal h3{font-size:20px;margin:16px 0 14px}#modal .field{padding:10px;margin:5px 0 10px}#modal label{font-size:12px}#modal textarea{max-height:110px}#modal .btn{padding:11px}body:has(dialog[open]){overflow:hidden}button{touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #72e4bf;outline-offset:2px}dialog{max-height:calc(100dvh - 44px)}@supports not (height:100dvh){dialog{max-height:80vh}}@media(max-height:700px){dialog{max-height:72dvh}}

header{padding-top:max(18px,env(safe-area-inset-top));-webkit-backdrop-filter:blur(16px)}
dialog:not([open]){display:none}dialog[open]{display:block}dialog::backdrop{-webkit-backdrop-filter:blur(4px)}

.btn.secondary{background:#2a3b41;color:#e8f5f1;border:1px solid #45616a}

</style></head><body><header><div class="head"><div><div class="logo">◉ Peptide Tracker</div><div class="small" id="clock"></div></div><select id="who" class="pill" onchange="setWho(this.value)"><option value="c">Carlos</option><option value="k">Kathy</option></select></div></header><main id="app"></main><nav id="nav"></nav><dialog id="dlg"><div class="modal-top"><span>Peptide Tracker</span><button type="button" class="modal-x" onclick="dismissModal()" aria-label="Cerrar">×</button></div><div id="modal"></div><div class="modal-footer"><button type="button" class="modal-cancel" onclick="dismissModal()">Cancelar y cerrar</button></div></dialog><script>
const KEY='pt_v1_demo';const initial=()=>({who:'c',weights:{c:[],k:[]},products:{c:[],k:[]},peptides:{c:[],k:[]},shots:[],events:[],vials:[],habits:{},goals:{c:null,k:null}});
if(!Array.prototype.at)Array.prototype.at=function(i){i=Math.trunc(i)||0;if(i<0)i+=this.length;return this[i]};let db,raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}try{db=raw?JSON.parse(raw):initial()}catch(e){try{localStorage.setItem(KEY+'_corrupt',raw)}catch(_){}db=initial()}if(!db||typeof db!=='object')db=initial();let page='today';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No se pudieron guardar los datos en este navegador. Exporte un respaldo antes de continuar.')}};const W=()=>db.who;const localDay=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>localDay();const now=()=>new Date().toISOString();const dateTime=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};const dateStr=s=>new Date(s+'T12:00').toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'});const n=v=>Number(v||0);const fmt=v=>n(v).toLocaleString('es-CR',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2,10);const eventList=()=>db.events.filter(e=>e.who===W()).sort((a,b)=>b.at.localeCompare(a.at));const products=()=>db.products[W()];const peps=()=>db.peptides[W()];const hkey=(day,k)=>W()+':'+day+':'+k;const hv=(day,k)=>db.habits[hkey(day,k)]??null;const changeHabit=(day,k,v)=>{db.habits[hkey(day,k)]=v;save();render()};const card=(title,body)=>`<section class="card"><h3>${title}</h3>${body}</section>`;const btn=(label,fn,cl='btn')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;const opts=(list)=>list.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');const input=(name,type='text',val='',extra='')=>`<label>${name}<input class="field" name="${name}" type="${type}" ${type==='number'?'inputmode="decimal"':''} value="${esc(val)}" ${extra}></label>`;const open=(html)=>{const d=document.getElementById('dlg');if(d.open)d.close();document.getElementById('modal').innerHTML=html;try{d.showModal()}catch(e){d.setAttribute('open','')}d.scrollTop=0};const close=()=>{const d=document.getElementById('dlg');try{d.close()}catch(e){}d.removeAttribute('open')};window.dismissModal=close;document.getElementById('dlg').addEventListener('click',e=>{if(e.target!==e.currentTarget)return;const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dismissModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')dismissModal()});document.getElementById('dlg').addEventListener('cancel',e=>{e.preventDefault();dismissModal()});const field=(f,k)=>f.elements.namedItem(k).value;const heading=(title)=>`<h2>${title}</h2>`;const weights=()=>db.weights[W()].slice().sort((a,b)=>a[0].localeCompare(b[0]));const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);
function setWho(w){db.who=w;save();render()}function go(p){page=p;render()}function render(){document.getElementById('who').value=W();document.getElementById('clock').textContent=new Date().toLocaleString('es-CR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});const pages={today:todayPage,progress:progressPage,peptides:peptidePage,inventory:inventoryPage,settings:settingsPage};document.getElementById('app').innerHTML=pages[page]();document.getElementById('nav').innerHTML=[['today','⌂','Mi día'],['progress','▥','Reportes'],['peptides','◉','Péptidos'],['inventory','◈','Inventario'],['settings','⚙','Config.']].map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${l}</button>`).join('')}
function checkRow(day,key,label){let v=hv(day,key);return `<div class="row item"><span>${esc(label)}</span><div>${btn(v===true?'✓ Sí':'Sí',`changeHabit('${day}','${key}',true)`,v===true?'btn':'btn secondary')} ${btn(v===false?'✕ No':'No',`changeHabit('${day}','${key}',false)`,v===false?'btn danger':'btn secondary')}</div></div>`}
function todayPage(){let day=today(),ws=weights(),last=ws.at(-1),todayEvents=eventList().filter(e=>e.at.slice(0,10)===day),meals=['Desayuno','Merienda AM','Almuerzo','Merienda PM','Cena'];let pToday=products().filter(p=>p.active!==false);let meds=pToday.filter(p=>p.type==='Medicamento'),supp=pToday.filter(p=>p.type==='Suplemento');return heading('Mi día · '+(W()==='c'?'Carlos':'Kathy'))+card('Registro rápido',`<div class="row"><div><div class="muted">Último peso</div><div class="big">${last?fmt(last[1])+' kg':'—'}</div></div>${btn('+ Peso','weightForm()')}</div><div class="row" style="margin-top:14px">${btn('+ Síntoma','symptomForm()','btn secondary')}${btn('+ Entreno','trainingForm()','btn secondary')}${btn('+ Nota','noteForm()','btn secondary')}</div>`)+card('Hábitos de hoy',checkRow(day,'water','💧 Hidratación cumplida')+meals.map((x,i)=>checkRow(day,'meal'+i,'🍽 '+x)).join('')+checkRow(day,'supp','💊 Suplementos del día'))+card('Medicamentos y suplementos',`<div class="muted">Cada producto puede marcarse individualmente.</div>${pToday.length?pToday.map(p=>checkRow(day,'prod'+p.id,(p.type==='Medicamento'?'💊 ':'◌ ')+p.name+(p.time?' · '+p.time:''))).join(''):'<p class="muted">Todavía no hay productos activos. Agregue los que toma actualmente.</p>'}${btn('+ Agregar producto','productForm()','btn secondary')}`)+card('Actividad cronológica',`<div class="row">${btn('+ Registrar evento','eventMenu()','btn secondary')}<span class="muted">${todayEvents.length} eventos</span></div>${todayEvents.length?todayEvents.map(eventHTML).join(''):'<p class="muted">Aún no hay eventos registrados hoy. Puede agregar varios a lo largo del día.</p>'}`)+card('Aplicaciones próximas',peps().filter(p=>p.active).map(p=>`<div class="item"><b>${esc(p.name)}</b><div class="muted">Cada ${p.days} día(s) desde ${dateStr(p.start)} · referencia registrada ${fmt(p.dose)} ${p.unit}</div>${upcomingHTML(p)}${btn('+ Registrar aplicación',`shotForm('${p.id}')`,'btn secondary')}</div>`).join('')||'<p class="muted">Sin péptidos activos.</p>')}
function eventHTML(e){return `<div class="item"><div class="row"><div><b>${new Date(e.at).toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'})} · ${esc(e.kind)}</b><div class="muted">${esc(e.detail||'')}</div></div>${btn('Editar',`editEvent('${e.id}')`,'btn outline')}</div></div>`}
function weightForm(){open(`<h3>Registrar peso</h3><form onsubmit="addWeight(event)">${input('Peso (kg)','number','', 'step="0.1" min="1" required')}${input('Fecha','date',today(),'required')}${btn('Guardar peso','', 'btn full')}</form>${btn('Cancelar','dismissModal()','btn secondary full')}`)}function addWeight(ev){ev.preventDefault();let f=ev.target;db.weights[W()].push([field(f,'Fecha'),n(field(f,'Peso (kg)'))]);db.events.push({id:id(),who:W(),at:dateTime(),kind:'Peso',detail:field(f,'Peso (kg)')+' kg · fecha de medición '+field(f,'Fecha')});save();close();render()}
const symptoms=['Náuseas','Diarrea','Estreñimiento','Migraña','Debilidad corporal','Mareos','Vómitos','Dolor abdominal bajo','Fatiga','Acidez o reflujo','Pérdida de apetito','Dolor en zona de inyección','Otro (personalizado)'];function symptomForm(){open(`<h3>Registrar síntoma</h3><form onsubmit="addSymptom(event)"><label>Síntoma<select name="symptom" class="field">${opts(symptoms)}</select></label>${input('Síntoma personalizado','text','') }<label>Intensidad<select name="intensity" class="field">${opts(['Leve','Moderado','Severo','Resuelto'])}</select></label>${input('Fecha y hora','datetime-local',dateTime(),'required')}<label>Observaciones<textarea name="notes" class="field" rows="2"></textarea></label>${btn('Guardar evento','','btn full')}</form>`)}function addSymptom(ev){ev.preventDefault();let f=ev.target;let symptom=field(f,'symptom');if(symptom.startsWith('Otro'))symptom=field(f,'Síntoma personalizado').trim();if(!symptom)return alert('Escriba el síntoma');db.events.push({id:id(),who:W(),at:field(f,'Fecha y hora'),kind:'Síntoma',detail:symptom+' · '+field(f,'intensity')+(field(f,'notes')?' · '+field(f,'notes'):'')});save();close();render()}
function trainingForm(){open(`<h3>Registrar entrenamiento</h3><form onsubmit="addTraining(event)"><label>Tipo<select class="field" name="kind">${opts(['Tren superior','Tren inferior','Mixto / cuerpo completo','Cardio'])}</select></label><label>Actividad cardio (opcional)<select class="field" name="cardio">${opts(['','Caminadora','Bicicleta estática','Caminata exterior','Bicicleta exterior','Otro'])}</select></label>${input('Duración en minutos (opcional)','number','', 'min="0"')}${input('Fecha y hora','datetime-local',dateTime(),'required')}${btn('Guardar','','btn full')}</form>`)}function addTraining(ev){ev.preventDefault();let f=ev.target;db.events.push({id:id(),who:W(),at:field(f,'Fecha y hora'),kind:'Entrenamiento',detail:[field(f,'kind'),field(f,'cardio'),field(f,'Duración en minutos (opcional)')?field(f,'Duración en minutos (opcional)')+' min':''].filter(Boolean).join(' · ')});save();close();render()}
function noteForm(){open(`<h3>Nota personal</h3><form onsubmit="addNote(event)"><label>Nota<textarea class="field" name="note" required rows="4"></textarea></label>${input('Fecha y hora','datetime-local',dateTime(),'required')}${btn('Guardar','','btn full')}</form>`)}function addNote(ev){ev.preventDefault();db.events.push({id:id(),who:W(),at:field(ev.target,'Fecha y hora'),kind:'Nota',detail:field(ev.target,'note')});save();close();render()}
function eventMenu(){open('<h3>Agregar evento</h3>'+[['Peso','weightForm()'],['Síntoma','symptomForm()'],['Entrenamiento','trainingForm()'],['Nota','noteForm()']].map(([l,fn])=>`<p>${btn('+ '+l,`close();${fn}`,'btn secondary full')}</p>`).join(''))}function editEvent(eid){let e=db.events.find(x=>x.id===eid);if(!e)return;open(`<h3>Editar evento</h3><form onsubmit="saveEvent(event,'${eid}')">${input('Fecha y hora','datetime-local',e.at.slice(0,16),'required')}<label>Descripción<textarea class="field" name="detail">${esc(e.detail)}</textarea></label>${btn('Guardar cambios','','btn full')}</form><p>${btn('Eliminar evento',`deleteEvent('${eid}')`,'btn danger full')}</p><p class="muted">Si modifica un evento de peso o una aplicación, revise también su registro correspondiente.</p>`)}function saveEvent(ev,eid){ev.preventDefault();let e=db.events.find(x=>x.id===eid);e.at=field(ev.target,'Fecha y hora');e.detail=field(ev.target,'detail');save();close();render()}function deleteEvent(eid){if(!confirm('¿Eliminar evento?'))return;db.events=db.events.filter(e=>e.id!==eid);save();close();render()}
function productForm(){let list=['Sertralina','Ácido valproico / Epival','Lovastatina','Pravastatina','Fenofibrato','Creatina','Omega-3','Vitamina D3','Vitamina K','Magnesio','Probióticos','Berberina','CoQ10','HMB','Ashwagandha','Rhodiola','Curcumina','Otro (escribir abajo)'];open(`<h3>Agregar medicamento o suplemento</h3><p class="muted">Solo se activará lo que usted elija. La lista no implica una recomendación.</p><form onsubmit="addProduct(event)"><label>Producto<select class="field" name="catalog">${opts(list)}</select></label>${input('Nombre personalizado','text')}<label>Tipo<select class="field" name="type">${opts(['Suplemento','Medicamento'])}</select></label>${input('Cantidad o indicación (opcional)','text')}${input('Horario (opcional)','time','08:00')}${btn('Agregar a mi perfil','','btn full')}</form>`)}function addProduct(ev){ev.preventDefault();let f=ev.target,name=field(f,'catalog');if(name.startsWith('Otro'))name=field(f,'Nombre personalizado').trim();if(!name)return alert('Escriba un nombre');products().push({id:id(),name,type:field(f,'type'),amount:field(f,'Cantidad o indicación (opcional)'),time:field(f,'Horario (opcional)'),active:true});save();close();render()}
const catalog=['Retatrutide (Retra)','Semaglutida','Tirzepatida','Tesamorelina','Ipamorelina','CJC-1295','BPC-157','GHK-Cu','Otro (personalizado)'];function peptidePage(){return heading('Mis péptidos')+`<p class="muted">Cada compuesto tiene su propio calendario y registro. Las recurrencias son documentales, no recomendaciones de dosis.</p>`+peps().map(p=>card(esc(p.name),`<div class="grid"><div class="stat"><span class="muted">Recurrencia</span><b>${p.days} días</b></div><div class="stat"><span class="muted">Referencia</span><b>${fmt(p.dose)} ${p.unit}</b></div></div><p class="muted">Inicio: ${dateStr(p.start)} · ${p.active?'Activo':'Pausado'}</p><h4>Próximas aplicaciones</h4>${p.active?upcomingHTML(p):'<p class="muted">Péptido pausado.</p>'}<div class="row">${btn('+ Aplicación',`shotForm('${p.id}')`)}${btn('Configurar',`editPep('${p.id}')`,'btn secondary')}</div><h4>Aplicaciones documentadas</h4>${db.shots.filter(s=>s.who===W()&&s.pid===p.id).sort((a,b)=>b.at.localeCompare(a.at)).map(s=>`<div class="item row"><span>${dateStr(s.at.slice(0,10))} · ${fmt(s.dose)} ${p.unit}</span>${btn('Eliminar',`deleteShot('${s.id}')`,'btn outline')}</div>`).join('')||'<p class="muted">Sin aplicaciones.</p>'}`)).join('')+calendarCard()+card('Agregar péptido',btn('+ Nuevo péptido','pepForm()','btn full'))}
function pepForm(){open(`<h3>Nuevo péptido</h3><form onsubmit="addPep(event)"><label>Catálogo<select class="field" name="catalog">${opts(catalog)}</select></label>${input('Nombre personalizado','text')} ${input('Fecha de inicio','date',today(),'required')}${input('Frecuencia en días','number','7','min="1" required')}${input('Cantidad de referencia','number','','min="0" step="any" required')}<label>Unidad<select name="unit" class="field">${opts(['mg','mcg'])}</select></label>${btn('Crear seguimiento','','btn full')}</form><p class="notice">No se generan pautas ni incrementos de dosis. Registre únicamente lo que corresponda a su historial o indicación clínica.</p>`)}function addPep(ev){ev.preventDefault();let f=ev.target,name=field(f,'catalog');if(name.startsWith('Otro'))name=field(f,'Nombre personalizado').trim();if(!name)return alert('Ingrese un nombre');peps().push({id:id(),name,start:field(f,'Fecha de inicio'),days:n(field(f,'Frecuencia en días')),dose:n(field(f,'Cantidad de referencia')),unit:field(f,'unit'),active:true});save();close();render()}
function editPep(pid){let p=peps().find(p=>p.id===pid);open(`<h3>Configurar ${esc(p.name)}</h3><form onsubmit="savePep(event,'${pid}')">${input('Frecuencia en días','number',p.days,'min="1" required')}${input('Cantidad de referencia','number',p.dose,'step="any" min="0" required')}${input('Fecha de inicio','date',p.start,'required')}<label>Estado<select class="field" name="active"><option value="yes" ${p.active?'selected':''}>Activo</option><option value="no" ${!p.active?'selected':''}>Pausado</option></select></label>${btn('Guardar','','btn full')}</form>`)}function savePep(ev,pid){ev.preventDefault();let p=peps().find(p=>p.id===pid),f=ev.target;p.days=n(field(f,'Frecuencia en días'));p.dose=n(field(f,'Cantidad de referencia'));p.start=field(f,'Fecha de inicio');p.active=field(f,'active')==='yes';save();close();render()}
function shotForm(pid){let p=peps().find(p=>p.id===pid),vs=db.vials.filter(v=>v.pid===pid&&(v.owner===W()||v.shared));open(`<h3>Registrar aplicación · ${esc(p.name)}</h3><form onsubmit="addShot(event,'${pid}')">${input('Fecha y hora','datetime-local',dateTime(),'required')}${input('Cantidad aplicada','number',p.dose,'min="0" step="any" required')}<label>Vial de origen<select class="field" name="vial"><option value="">Sin asociar a inventario</option>${vs.map(v=>`<option value="${v.id}">${esc(v.label)} · ${fmt(v.total)} mg iniciales</option>`).join('')}</select></label>${btn('Registrar aplicación','','btn full')}</form>`)}function addShot(ev,pid){ev.preventDefault();let f=ev.target;db.shots.push({id:id(),who:W(),pid,at:field(f,'Fecha y hora'),dose:n(field(f,'Cantidad aplicada')),vial:field(f,'vial')||null});save();close();render()}function deleteShot(sid){if(!confirm('¿Eliminar aplicación registrada?'))return;db.shots=db.shots.filter(s=>s.id!==sid);save();render()}
function vialForm(){let ps=peps();open(`<h3>Agregar vial</h3><form onsubmit="addVial(event)">${input('Nombre del vial','text','Vial 30 mg','required')}<label>Péptido<select class="field" name="pid">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>${input('Cantidad inicial (mg)','number','30','step="any" min="0.01" required')}${input('Fecha de apertura','date',today())}<label>Acceso<select class="field" name="shared"><option value="no">Solo mi perfil</option><option value="yes">Compartido con el otro perfil</option></select></label>${btn('Guardar vial','','btn full')}</form>`)}function addVial(ev){ev.preventDefault();let f=ev.target;db.vials.push({id:id(),owner:W(),pid:field(f,'pid'),label:field(f,'Nombre del vial'),total:n(field(f,'Cantidad inicial (mg)')),opened:field(f,'Fecha de apertura'),shared:field(f,'shared')==='yes',loss:0});save();close();render()}function adjustVial(vid){open(`<h3>Registrar pérdida o ajuste</h3><form onsubmit="adjustSave(event,'${vid}')">${input('Pérdida acumulada (mg)','number',db.vials.find(v=>v.id===vid).loss,'min="0" step="any"')}${btn('Guardar','','btn full')}</form>`)}function adjustSave(ev,vid){ev.preventDefault();db.vials.find(v=>v.id===vid).loss=n(field(ev.target,'Pérdida acumulada (mg)'));save();close();render()}
function progressPage(){let w=weights(),first=w[0],last=w.at(-1),delta=first&&last?last[1]-first[1]:0;let end=today(),start=new Date();start.setDate(start.getDate()-6);let startS=localDay(start);let evs=eventList().filter(e=>e.at.slice(0,10)>=startS&&e.at.slice(0,10)<=end),sym=evs.filter(e=>e.kind==='Síntoma'),train=evs.filter(e=>e.kind==='Entrenamiento');let days=Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return localDay(d)});let habits=['water','meal0','meal1','meal2','meal3','meal4','supp'];let done=0,total=0;for(let d of days)for(let h of habits){let v=hv(d,h);if(v!==null){total++;if(v)done++}}let graph=w.length>1?rangeBtns()+lineGraph(rangeW(w)):'<p class="muted">Agregue más pesos para visualizar la evolución.</p>';return heading('Progreso y reportes')+card('Evolución de peso',`<div class="grid"><div class="stat"><span class="muted">Inicial</span><b>${first?fmt(first[1]):'—'} kg</b></div><div class="stat"><span class="muted">Actual</span><b>${last?fmt(last[1]):'—'} kg</b></div></div><p class="mint">Cambio acumulado: ${fmt(delta)} kg (${first?fmt(delta/first[1]*100):0} %)</p>${graph}`)+card('Resumen · últimos 7 días',`<div class="grid"><div class="stat"><span class="muted">Entrenamientos</span><b>${train.length}</b></div><div class="stat"><span class="muted">Síntomas registrados</span><b>${sym.length}</b></div><div class="stat"><span class="muted">Hábitos confirmados</span><b>${done}/${total}</b></div><div class="stat"><span class="muted">Aplicaciones</span><b>${db.shots.filter(s=>s.who===W()&&s.at.slice(0,10)>=startS&&s.at.slice(0,10)<=end).length}</b></div></div><h4>Síntomas de la semana</h4>${sym.map(e=>`<div class="item"><b>${dateStr(e.at.slice(0,10))}</b> · ${esc(e.detail)}</div>`).join('')||'<p class="muted">Sin síntomas registrados.</p>'}<p class="muted">Las casillas no respondidas se excluyen del porcentaje de cumplimiento.</p>`)+card('Aplicaciones registradas',doseChart())+card('Historial de peso',w.slice().reverse().map(x=>`<div class="item row"><span>${dateStr(x[0])}</span><span><b>${fmt(x[1])} kg</b> ${btn('✕',`delWeight('${x[0]}')`,'btn outline')}</span></div>`).join(''))}
function settingsPage(){return heading('Configuración')+card('Productos configurados',(products().map(p=>`<div class="item row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.type)} ${p.time?'· '+p.time:''}</div></div>${btn(p.active?'Pausar':'Activar',`toggleProduct('${p.id}')`,'btn secondary')} ${btn('✕',`delProduct('${p.id}')`,'btn outline')}</div>`).join('')||'<p class="muted">Sin medicamentos ni suplementos configurados.</p>')+btn('+ Agregar producto','productForm()','btn full'))+card('Respaldo de datos',`<p class="muted">Los datos solo existen en este dispositivo. Exporte un respaldo con regularidad; Safari puede borrar los datos de sitios web que no se abren por varios días, por eso conviene añadir la app a la pantalla de inicio.</p>${btn('Exportar JSON','exportData()','btn secondary')} ${btn('Compartir','shareData()','btn secondary')} ${hasPrev()?btn('Deshacer importación','undoPrev()','btn outline'):''}<label>Importar respaldo<input class="field" type="file" accept="application/json,.json" onchange="importData(event)"></label>`)+card('Bloqueo con PIN',pinCard())+card('Privacidad y límites',`<p class="muted">Los datos se guardan solo en este dispositivo y navegador. El selector Carlos/Kathy separa los registros; con PIN activado, además bloquea el acceso a cada perfil. No hay sincronización entre dispositivos, notificaciones push ni conexión a Apple Health.</p><p class="notice">No sustituye asesoramiento médico. No calcula dosis recomendadas ni propone combinaciones de péptidos.</p>${btn('Restablecer demo','resetDemo()','btn danger')}`)}function toggleProduct(pid){let p=products().find(x=>x.id===pid);p.active=!p.active;save();render()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='peptide-tracker-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},5000)}function importData(ev){let file=ev.target.files[0];if(!file)return;if(file.size>5*1024*1024){alert('El respaldo supera 5 MB');return;}let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||typeof v!=='object'||!['c','k'].includes(v.who)||!v.weights||!Array.isArray(v.weights.c)||!Array.isArray(v.weights.k)||!v.peptides||!Array.isArray(v.peptides.c)||!Array.isArray(v.peptides.k)||!v.products||!Array.isArray(v.products.c)||!Array.isArray(v.products.k)||!Array.isArray(v.events)||!Array.isArray(v.shots)||!Array.isArray(v.vials)||!v.habits||typeof v.habits!=='object'||!v.goals)throw Error('Formato de respaldo inválido');if(confirm('¿Reemplazar los datos actuales por este respaldo? Se guardará una copia de los actuales para poder deshacer.')){try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(e){}db=normalize(v);unlocked.clear();save();render()}}catch(e){alert(e.message)}};r.readAsText(file)}function resetDemo(){if(confirm('¿Borrar TODOS los registros locales y restaurar el ejemplo?')){try{localStorage.setItem(KEY+'_prev',JSON.stringify(db))}catch(e){}db=normalize(initial());unlocked.clear();save();render()}}
</script><script>
/* ===== v2: datos, bloqueo, calendario, inventario, reportes ===== */
const normalize=v=>{['weights','products','peptides'].forEach(k=>{v[k]=v[k]&&typeof v[k]==='object'?v[k]:{};['c','k'].forEach(u=>{if(!Array.isArray(v[k][u]))v[k][u]=[]})});['events','shots','vials'].forEach(k=>{if(!Array.isArray(v[k]))v[k]=[]});v.habits=v.habits&&typeof v.habits==='object'?v.habits:{};v.goals=v.goals||{c:null,k:null};v.sec=v.sec&&typeof v.sec==='object'?v.sec:{};if(!['c','k'].includes(v.who))v.who='c';v.vials.forEach(x=>{x.loss=Number(x.loss)||0});return v};
db=normalize(db);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const NAME={c:'Carlos',k:'Kathy'},other=w=>w==='c'?'k':'c',unlocked=new Set();
const hs=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const isLocked=()=>!!(db.sec[W()]&&db.sec[W()].pin)&&!unlocked.has(W());
const hasPrev=()=>{try{return!!localStorage.getItem(KEY+'_prev')}catch(e){return false}};
function showLock(){close();let L=document.getElementById('lock');if(!L){L=document.createElement('div');L.id='lock';document.body.appendChild(L)}const w=W(),o=other(w);L.innerHTML=`<div><h2>🔒 ${NAME[w]}</h2><form onsubmit="tryPin(event)"><label>PIN<input class="field" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" required></label><p id="lockmsg" class="muted"></p><button class="btn full">Entrar</button></form><p><button type="button" class="btn secondary full" onclick="setWho('${o}')">Cancelar · ir al perfil de ${NAME[o]}</button></p><p><button type="button" class="btn outline full" onclick="forgotPin()">Olvidé mi PIN</button></p></div>`;L.style.display='flex';document.getElementById('app').innerHTML='';document.getElementById('nav').innerHTML=''}
const hideLock=()=>{const L=document.getElementById('lock');if(L)L.style.display='none'};
function tryPin(ev){ev.preventDefault();const v=ev.target.elements.pin.value;if(hs('p'+v)===db.sec[W()].pin){unlocked.add(W());render()}else{document.getElementById('lockmsg').textContent='PIN incorrecto';ev.target.reset()}}
function forgotPin(){const c=prompt('Código de recuperación (se mostró al crear el PIN):');if(c===null)return;if(hs('r'+c.trim().toUpperCase())===db.sec[W()].rec){delete db.sec[W()];save();unlocked.add(W());render();alert('PIN eliminado. Cree uno nuevo en Config.')}else alert('Código incorrecto')}
const pinCard=()=>`<p class="muted">Pide un PIN al abrir la app o al cambiar a este perfil. Es un bloqueo de pantalla: no cifra los datos ni los respaldos.</p><p class="muted">PIN de ${NAME[W()]}: ${db.sec[W()]?'activado':'sin PIN'}</p>${btn(db.sec[W()]?'Cambiar PIN':'Crear PIN','pinForm()','btn secondary')} ${db.sec[W()]?btn('Quitar PIN','removePin()','btn outline'):''}`;
function pinForm(){open(`<h3>PIN de ${NAME[W()]}</h3><form onsubmit="setPin(event)">${input('PIN (4 a 8 dígitos)','password','','inputmode="numeric" maxlength="8" required')}${btn('Guardar PIN','','btn full')}</form>`)}
function setPin(ev){ev.preventDefault();const v=field(ev.target,'PIN (4 a 8 dígitos)');if(!/^\d{4,8}$/.test(v))return alert('El PIN debe tener de 4 a 8 dígitos');const r=new Uint8Array(8);try{crypto.getRandomValues(r)}catch(e){r.forEach((_,i)=>r[i]=Math.random()*256)}const rc=[...r].map(x=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[x%31]).join('');db.sec[W()]={pin:hs('p'+v),rec:hs('r'+rc)};unlocked.add(W());save();render();open(`<h3>Código de recuperación</h3><p class="muted">Anótelo ahora. Es la única forma de recuperar el acceso si olvida el PIN.</p><p class="big mint" style="letter-spacing:3px">${rc}</p>${btn('Ya lo guardé','dismissModal()','btn full')}`)}
function removePin(){if(!confirm('¿Quitar el PIN de este perfil?'))return;delete db.sec[W()];save();render()}
let hidAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hidAt=Date.now();else if(hidAt&&Date.now()-hidAt>3e5&&unlocked.size){unlocked.clear();close();render()}});

function setWho(w){db.who=w;save();render()}
function go(p){page=p;render();scrollTo(0,0)}
function render(){const y=window.scrollY;document.getElementById('who').value=W();if(isLocked()){showLock();return}hideLock();document.getElementById('clock').textContent=new Date().toLocaleString('es-CR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});const pages={today:todayPage,progress:progressPage,peptides:peptidePage,inventory:inventoryPage,settings:settingsPage};document.getElementById('app').innerHTML=pages[page]();document.getElementById('nav').innerHTML=[['today','⌂','Mi día'],['progress','▥','Reportes'],['peptides','◉','Péptidos'],['inventory','◈','Inventario'],['settings','⚙','Config.']].map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${l}</button>`).join('');scrollTo(0,y)}

function addWeight(ev){ev.preventDefault();const f=ev.target,d=field(f,'Fecha'),v=n(field(f,'Peso (kg)'));if(!(v>0)||!d||d>today())return alert('Revise el peso y la fecha (no puede ser futura).');const w=db.weights[W()],i=w.findIndex(x=>x[0]===d);if(i>=0){if(!confirm('Ya hay un peso en esa fecha. ¿Reemplazarlo?'))return;w[i]=[d,v]}else w.push([d,v]);db.events.push({id:id(),who:W(),at:d+dateTime().slice(10),kind:'Peso',detail:v+' kg'});save();close();render()}
function delWeight(d){if(!confirm('¿Eliminar este peso?'))return;db.weights[W()]=db.weights[W()].filter(x=>x[0]!==d);save();render()}
function delProduct(pid){if(!confirm('¿Eliminar este producto de su perfil?'))return;db.products[W()]=db.products[W()].filter(p=>p.id!==pid);save();render()}

const allPeps=()=>[...db.peptides.c,...db.peptides.k],pOf=pid=>allPeps().find(p=>p.id===pid),mg=(v,u)=>u==='mcg'?v/1000:v,shotMg=s=>{const p=pOf(s.pid);return mg(s.dose,p?p.unit:'mg')};
const addD=(s,k)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+k);return localDay(d)};
const sameComp=(v,p)=>{const q=pOf(v.pid);return !!q&&q.name===p.name};
const lastShot=p=>db.shots.filter(s=>s.pid===p.id).sort((a,b)=>b.at.localeCompare(a.at))[0];
const lastDose=p=>{const s=lastShot(p);return s?s.dose:p.dose};
const nextDue=p=>{const s=lastShot(p);return s?addD(s.at.slice(0,10),p.days):p.start};
function upcomingHTML(p){if(!(p.days>0))return'';let d=nextDue(p),t=today(),o=[];for(let i=0;i<3;i++){const k=daysBetween(t,d);o.push(`<div class="item row"><span>${dateStr(d)}</span><span class="${k<=0?'mint':'muted'}">${k<0?'Atrasada '+(-k)+' d':k===0?'Hoy':'en '+k+' d'} · ${fmt(lastDose(p))} ${p.unit}</span></div>`);d=addD(d,p.days)}return o.join('')}
let calM=null;
function calendarCard(){const t=new Date();if(!calM)calM=[t.getFullYear(),t.getMonth()];const[y,m]=calM,first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),P=x=>String(x).padStart(2,'0'),ym=y+'-'+P(m+1),last=ym+'-'+P(dim),applied=new Set(db.shots.filter(s=>s.who===W()).map(s=>s.at.slice(0,10))),sched=new Set();peps().filter(p=>p.active&&p.days>0).forEach(p=>{let d=nextDue(p),g=0;while(d<ym+'-01'&&g++<3000)d=addD(d,p.days);while(d<=last&&g++<3000){sched.add(d);d=addD(d,p.days)}});let cells='<div></div>'.repeat(off);for(let i=1;i<=dim;i++){const ds=ym+'-'+P(i);cells+=`<div class="cd ${ds===today()?'t':''} ${applied.has(ds)?'a':sched.has(ds)?'s':''}">${i}</div>`}return card('Calendario · '+first.toLocaleDateString('es-CR',{month:'long',year:'numeric'}),`<div class="row" style="margin-bottom:10px">${btn('‹','calNav(-1)','btn secondary')}<span class="muted">● aplicada · ○ programada</span>${btn('›','calNav(1)','btn secondary')}</div><div class="cal">${['L','M','M','J','V','S','D'].map(x=>`<b class="muted">${x}</b>`).join('')}${cells}</div>`)}
function calNav(k){const d=new Date(calM[0],calM[1]+k,1);calM=[d.getFullYear(),d.getMonth()];render()}

function shotForm(pid){const p=pOf(pid),vs=db.vials.filter(v=>sameComp(v,p)&&(v.owner===W()||v.shared));open(`<h3>Registrar aplicación · ${esc(p.name)}</h3><form onsubmit="addShot(event,'${pid}')">${input('Fecha y hora','datetime-local',dateTime(),'required')}<p class="muted">Unidad: ${p.unit}</p>${input('Cantidad aplicada','number',lastDose(p),'min="0" step="any" required')}<label>Vial de origen<select class="field" name="vial"><option value="">Sin asociar a inventario</option>${vs.map(v=>`<option value="${v.id}">${esc(v.label)} · ${fmt(vialStats(v).remaining)} mg disp.</option>`).join('')}</select></label>${btn('Registrar aplicación','','btn full')}</form>`)}
function addShot(ev,pid){ev.preventDefault();const f=ev.target,vid=field(f,'vial')||null,dose=n(field(f,'Cantidad aplicada')),p=pOf(pid);if(!(dose>0))return alert('Indique una cantidad mayor que 0.');if(vid){const r=vialStats(db.vials.find(x=>x.id===vid)).remaining;if(mg(dose,p.unit)>r+1e-9&&!confirm('Según el registro, al vial le quedan '+fmt(r)+' mg. ¿Registrar de todos modos?'))return}db.shots.push({id:id(),who:W(),pid,at:field(f,'Fecha y hora'),dose,vial:vid});save();close();render()}

function vialStats(v){const by={c:0,k:0};let used=0;db.shots.filter(s=>s.vial===v.id).forEach(s=>{const x=shotMg(s);used+=x;by[s.who]=(by[s.who]||0)+x});const remaining=Math.max(0,v.total-used-n(v.loss)),base=pOf(v.pid);let rate=0;if(base)['c','k'].forEach(u=>{if(u!==v.owner&&!v.shared)return;db.peptides[u].forEach(p=>{if(p.active&&p.name===base.name&&p.days>0)rate+=mg(lastDose(p),p.unit)/p.days})});return{used,by,remaining,days:rate>0?Math.floor(remaining/rate):null,pct:v.total>0?Math.min(100,remaining/v.total*100):0}}
function inventoryPage(){const vs=db.vials.filter(v=>v.owner===W()||v.shared);return heading('Inventario de viales')+`<p class="muted">Los viales son privados por defecto. Se pueden compartir individualmente entre Carlos y Kathy.</p>`+(vs.map(v=>{const s=vialStats(v),est=s.remaining<=0?'Agotado':s.days===null?'Sin proyección':new Date(Date.now()+s.days*864e5).toLocaleDateString('es-CR',{day:'numeric',month:'short'})+' (~'+s.days+' d)';return card(esc(v.label)+(v.owner!==W()?' <span class="chip">de '+NAME[v.owner]+'</span>':''),`<div class="big">${fmt(s.remaining)} mg</div><div class="muted">de ${fmt(v.total)} mg · ${v.shared?'Compartido':'Individual'}${v.opened?' · abierto '+dateStr(v.opened):''}</div><div class="bar" style="margin:12px 0"><div style="width:${s.pct}%"></div></div><div class="grid"><div class="stat"><div class="muted">Consumido registrado</div><b>${fmt(s.used)} mg</b></div><div class="stat"><div class="muted">Agotamiento estimado</div><b style="font-size:15px">${est}</b></div></div>${v.shared?`<p class="muted">Carlos ${fmt(s.by.c)} mg · Kathy ${fmt(s.by.k)} mg</p>`:''}<p class="muted">Pérdida/ajuste: ${fmt(v.loss)} mg. La proyección usa la última cantidad aplicada y la frecuencia de cada péptido activo; no incluye pérdidas no registradas.</p>${v.owner===W()?btn('Ajustar / eliminar',`adjustVial('${v.id}')`,'btn secondary'):''}`)}).join('')||'<p class="muted">Aún no hay viales.</p>')+card('Nuevo vial',btn('+ Agregar vial','vialForm()','btn full'))+`<p class="notice">El inventario inicial de 30 mg no se ha creado automáticamente: aún falta confirmar qué aplicaciones salieron de ese vial.</p>`}
function adjustVial(vid){const v=db.vials.find(x=>x.id===vid);open(`<h3>Ajustar vial</h3><form onsubmit="adjustSave(event,'${vid}')">${input('Pérdida acumulada (mg)','number',v.loss,'min="0" step="any"')}${btn('Guardar','','btn full')}</form><p>${btn('Eliminar vial',`delVial('${vid}')`,'btn danger full')}</p>`)}
function delVial(vid){const k=db.shots.filter(s=>s.vial===vid).length;if(!confirm('¿Eliminar este vial?'+(k?' Sus '+k+' aplicaciones quedarán sin vial asociado.':'')))return;db.shots.forEach(s=>{if(s.vial===vid)s.vial=null});db.vials=db.vials.filter(v=>v.id!==vid);save();close();render()}

let range=0;const rangeW=w=>{if(!range)return w;const c=addD(today(),-range),f=w.filter(x=>x[0]>=c);return f.length>=2?f:w.slice(-2)},setRange=r=>{range=r;render()},rangeBtns=()=>`<div class="tabs">${[[30,'30 días'],[90,'90 días'],[0,'Todo']].map(([r,l])=>btn(l,`setRange(${r})`,range===r?'btn':'btn secondary')).join('')}</div>`;
function lineGraph(w){const v=w.map(x=>x[1]),mn=Math.min(...v)-.5,mx=Math.max(...v)+.5,t0=new Date(w[0][0]+'T12:00').getTime(),sp=Math.max(1,new Date(w.at(-1)[0]+'T12:00').getTime()-t0),X=i=>40+(new Date(w[i][0]+'T12:00').getTime()-t0)/sp*280,Y=x=>125-(x-mn)/(mx-mn)*105;return `<svg viewBox="0 0 340 150" role="img" aria-label="Gráfica de peso"><line x1="40" y1="125" x2="325" y2="125" stroke="#46585e"/><line x1="40" y1="20" x2="40" y2="125" stroke="#46585e"/><text x="36" y="24" fill="#aebdc3" font-size="10" text-anchor="end">${fmt(mx)}</text><text x="36" y="125" fill="#aebdc3" font-size="10" text-anchor="end">${fmt(mn)}</text><polyline points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}" fill="none" stroke="#51cfa7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="3" fill="#51cfa7"/>`).join('')}<text x="40" y="144" fill="#aebdc3" font-size="10">${esc(dateStr(w[0][0]))}</text><text x="325" y="144" fill="#aebdc3" font-size="10" text-anchor="end">${esc(dateStr(w.at(-1)[0]))}</text></svg>`}
function doseChart(){const o=peps().map(p=>{const s=db.shots.filter(x=>x.who===W()&&x.pid===p.id).sort((a,b)=>a.at.localeCompare(b.at)).slice(-12);if(!s.length)return'';const mx=Math.max(...s.map(x=>x.dose))||1,bw=300/s.length;return `<h4>${esc(p.name)} (${p.unit})</h4><svg viewBox="0 0 340 130">${s.map((x,i)=>{const h=x.dose/mx*80,cx=20+i*bw+bw/2;return `<rect x="${cx-Math.max(4,bw-6)/2}" y="${95-h}" width="${Math.max(4,bw-6)}" height="${h}" rx="3" fill="#51cfa7"/><text x="${cx}" y="${90-h}" font-size="9" fill="#aebdc3" text-anchor="middle">${fmt(x.dose)}</text><text x="${cx}" y="110" font-size="8" fill="#aebdc3" text-anchor="middle">${x.at.slice(8,10)}/${x.at.slice(5,7)}</text>`}).join('')}</svg>`}).join('');return o||'<p class="muted">Aún no hay aplicaciones registradas.</p>'}

async function shareData(){const f=new File([JSON.stringify(db,null,2)],'peptide-tracker-'+today()+'.json',{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Respaldo Peptide Tracker'});return}}catch(e){if(e&&e.name==='AbortError')return}exportData()}
function undoPrev(){let p=null;try{p=localStorage.getItem(KEY+'_prev')}catch(e){}if(!p)return alert('No hay copia anterior.');if(!confirm('¿Restaurar la copia anterior? Los datos actuales se guardarán como copia para poder volver.'))return;try{const v=normalize(JSON.parse(p));localStorage.setItem(KEY+'_prev',JSON.stringify(db));db=v;unlocked.clear();save();render()}catch(e){alert('La copia anterior no es válida.')}}
render();
</script></body></html>
